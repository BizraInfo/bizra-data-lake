[package]
name = "meta_alpha_dual_agentic"
version = "2.0.0"
edition = "2021"
authors = ["BIZRA Team"]
description = "Complete unified production system: PAT + SAT with full arsenal"

[dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP server
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }

# HTTP client (for Ollama)
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10.9"
prometheus = "0.14.0"
lazy_static = "1.5.0"
neo4rs = "0.8.0"

[features]
default = ["http", "observability"]
http = []
observability = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
