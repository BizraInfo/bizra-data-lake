# Prometheus configuration for BIZRA Glass Cockpit
# Scrape interval: 15s for real-time observability

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bizra-glass-cockpit'
    environment: 'development'

# Alerting configuration (future: wire to PagerDuty/Slack)
alerting:
  alertmanagers: []

# Rule files for SLO burn rate alerts
rule_files: []
  # - /etc/prometheus/rules/*.yml

scrape_configs:
  # BIZRA Kernel metrics endpoint
  - job_name: 'bizra-kernel'
    static_configs:
      - targets: ['kernel:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Neo4j (wisdom) - if metrics endpoint enabled
  - job_name: 'neo4j'
    static_configs:
      - targets: ['wisdom:2004']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Redis (synapse) - via redis_exporter if deployed
  - job_name: 'redis'
    static_configs:
      - targets: ['synapse:6379']
    metrics_path: '/metrics'
    scrape_interval: 30s
