name: phase0-integrity

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust fmt
        run: cargo fmt --check

      - name: Rust clippy (deny warnings)
        run: cargo clippy -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Python deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Python syntax (repo scripts)
        run: python -m py_compile genesis_tribute.py bizra_refinery.py bizra_synaptic_loader.py scripts/genesis_receipt.py core/__init__.py core/fate.py core/wisdom.py core/model_family.py core/llm.py core/sape.py core/main.py

      - name: YAML sanity (blueprints + tokenomics)
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for p in [
            Path("docs/blueprints/backlog_v1.yaml"),
            Path("constitution/ihsan_v1.yaml"),
            Path("BIZRA_TOKENOMICS_GENESIS.yaml"),
            Path("docs/slo/service_level_objectives_v1.yaml"),
            Path("docker-compose.yml"),
          ]:
            yaml.safe_load(p.read_text(encoding="utf-8", errors="replace"))
          print("yaml_ok")
          PY

      - name: JSON sanity (schemas + examples)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
            Path("schemas/genesis_receipt_v1.schema.json"),
            Path("docs/evidence/genesis_receipt_v1.example.json"),
          ]:
            json.loads(p.read_text(encoding="utf-8", errors="replace"))
          print("json_ok")
          PY

      - name: Portability lint
        run: python tools/portability_lint.py

      - name: Model family lint (sealed manifests)
        run: python tools/model_family_lint.py

      - name: Truth-label lint
        run: python tools/truth_lint.py

      - name: Lexicon lint
        run: python tools/lexicon_lint.py

      - name: Lexicon tamper test
        run: python tools/lexicon_tamper_test.py

      - name: Node0 secure-defaults lint
        run: python tools/node0_secure_defaults_lint.py

      - name: Ihsan parity (Rust/Python)
        run: python tools/ihsan_parity_check.py

      - name: Genesis manifest profile lint
        run: python tools/genesis_manifest.py profile-lint

      - name: Genesis manifest verify (optional)
        run: python tools/genesis_manifest.py verify --optional --allow-missing-repos

  node0-backend:
    if: ${{ hashFiles('bizra-genesis-node/backend/Cargo.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Node0 backend (SQLx offline + warning budget)
        env:
          NODE0_MAX_WARNINGS: "205"
        run: python tools/node0_warning_budget.py

  performance-gate:
    runs-on: ubuntu-latest
    needs: rust-core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Compile time regression gate
        run: |
          START=$(date +%s%N)
          cargo build --release 2>/dev/null
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "Build time: ${ELAPSED}ms"
          # Gate: fail if build exceeds 120 seconds (2 minutes)
          if [ $ELAPSED -gt 120000 ]; then
            echo "::error::Build time regression detected: ${ELAPSED}ms > 120000ms"
            exit 1
          fi

      - name: Test execution time gate
        run: |
          START=$(date +%s%N)
          cargo test --release 2>/dev/null
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "Test time: ${ELAPSED}ms"
          # Gate: fail if tests exceed 60 seconds
          if [ $ELAPSED -gt 60000 ]; then
            echo "::error::Test time regression detected: ${ELAPSED}ms > 60000ms"
            exit 1
          fi

      - name: Binary size gate
        run: |
          SIZE=$(stat -c%s target/release/meta_alpha_dual_agentic 2>/dev/null || echo "0")
          echo "Binary size: ${SIZE} bytes"
          # Gate: fail if binary exceeds 50MB
          if [ $SIZE -gt 52428800 ]; then
            echo "::error::Binary size regression: ${SIZE} > 52428800 bytes (50MB)"
            exit 1
          fi

  signed-evidence:
    runs-on: ubuntu-latest
    needs: [rust-core, performance-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: python -m pip install --upgrade pip pyyaml

      - name: Generate CI evidence receipt
        run: |
          python - <<'PY'
          import json
          import hashlib
          import os
          from datetime import datetime, timezone

          receipt = {
              "schema": "bizra-ci-evidence-v1",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "commit_sha": os.environ.get("GITHUB_SHA", "unknown"),
              "ref": os.environ.get("GITHUB_REF", "unknown"),
              "run_id": os.environ.get("GITHUB_RUN_ID", "unknown"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", "unknown"),
              "actor": os.environ.get("GITHUB_ACTOR", "unknown"),
              "gates_passed": [
                  "rust-fmt",
                  "rust-clippy",
                  "rust-tests",
                  "yaml-sanity",
                  "json-sanity",
                  "portability-lint",
                  "model-family-lint",
                  "truth-lint",
                  "lexicon-lint",
                  "ihsan-parity",
                  "performance-gate",
                  "gitleaks"
              ],
              "ihsan_threshold": "ci=0.90"
          }

          receipt_json = json.dumps(receipt, indent=2, sort_keys=True)
          receipt_hash = hashlib.sha256(receipt_json.encode()).hexdigest()
          receipt["integrity_hash"] = f"sha256:{receipt_hash}"

          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.sha }}
          path: |
            docs/evidence/*.json
          retention-days: 90

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
