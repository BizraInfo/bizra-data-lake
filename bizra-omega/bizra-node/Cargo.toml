[package]
name = "bizra-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node0 — The sovereign node binary. Stands on hooks (nerves), memory (brain), agent (being). Speaks a stdio protocol that any host can drive."
publish = false

[[bin]]
name = "bizra-node"
path = "src/main.rs"

[lib]
name = "bizra_node"
path = "src/lib.rs"

[dependencies]
bizra-hooks = { path = "../bizra-hooks" }
bizra-memory = { path = "../bizra-memory" }
bizra-agent = { path = "../bizra-agent" }
bizra-action = { path = "../bizra-action" }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
bizra-telescript = { path = "../bizra-telescript" }
bizra-core = { path = "../bizra-core" }
bizra-inference = { path = "../bizra-inference" }
bizra-mission = { path = "../bizra-mission" }
blake3 = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
