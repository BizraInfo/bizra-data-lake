# BIZRA Data Lake — Deployment Pipeline
# Enterprise-grade CD with GitOps and Progressive Rollout
#
# Standing on Giants: ArgoCD • Kubernetes • Helm
# Constitutional Constraint: Production deploys require SNR >= 0.95
#
# Deployment Flow:
# ┌───────────────────────────────────────────────────────────────────────────┐
# │  BUILD & PUSH  →  STAGING  →  SMOKE TESTS  →  PRODUCTION  →  VERIFY      │
# └───────────────────────────────────────────────────────────────────────────┘

name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_staging:
        description: 'Skip staging (emergency hotfix)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false  # Never cancel an in-progress deployment

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'
  HELM_VERSION: '3.14.0'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 1: Build and Push Container Images
  # ═══════════════════════════════════════════════════════════════════════════
  build-push:
    name: Build & Push
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      python-image: ${{ steps.meta-python.outputs.tags }}
      rust-image: ${{ steps.meta-rust.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="sha-${{ github.sha }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Python Elite Image
      - name: Extract metadata (Python)
        id: meta-python
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/elite
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Python image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: deploy/Dockerfile.elite
          push: true
          tags: ${{ steps.meta-python.outputs.tags }}
          labels: ${{ steps.meta-python.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

      # Rust Omega Image (CPU)
      - name: Extract metadata (Rust)
        id: meta-rust
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/omega
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Rust image (CPU)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: bizra-omega
          file: bizra-omega/Dockerfile
          push: true
          tags: ${{ steps.meta-rust.outputs.tags }}
          labels: ${{ steps.meta-rust.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rust Omega Image (CUDA)
      - name: Build and push Rust image (CUDA)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: bizra-omega
          file: bizra-omega/Dockerfile
          push: true
          build-args: CUDA=1
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/omega:${{ steps.version.outputs.version }}-cuda
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/omega:cuda
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (MCP)
        id: meta-mcp
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push MCP image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: deploy/Dockerfile.mcp
          push: true
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend (DDAGI OS) Image
      - name: Extract metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 2: Deploy to Staging
  # ═══════════════════════════════════════════════════════════════════════════
  # Audit trail: log who bypassed staging and why
  staging-bypass-audit:
    name: Staging Bypass Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build-push
    if: ${{ github.event.inputs.skip_staging == 'true' && github.event_name != 'release' }}
    steps:
      - name: Block production staging bypass
        if: ${{ github.event.inputs.environment == 'production' }}
        run: |
          echo "::error::Staging bypass is forbidden for production deployments."
          echo "## BLOCKED: Staging bypass for production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | ${{ github.event.inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **DENIED:** Production deploys must pass staging and smoke tests." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Record bypass audit trail
        run: |
          echo "## Staging Bypass Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ref** | ${{ github.ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run ID** | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Warning:** Staging environment was bypassed — deploying directly to production." >> $GITHUB_STEP_SUMMARY
          echo "> This bypass should only be used for verified emergency hotfixes." >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build-push
    if: ${{ github.event.inputs.skip_staging != 'true' || github.event_name == 'release' }}
    environment:
      name: staging
      url: https://staging.bizra.node0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8  # v3
        with:
          version: 'latest'

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78  # v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update Kubernetes manifests
        run: |
          sed -i \
            -e 's/newTag: elite-placeholder/newTag: ${{ needs.build-push.outputs.version }}/' \
            -e 's/newTag: omega-placeholder/newTag: ${{ needs.build-push.outputs.version }}/' \
            -e 's/newTag: mcp-placeholder/newTag: ${{ needs.build-push.outputs.version }}/' \
            -e 's/newTag: frontend-placeholder/newTag: ${{ needs.build-push.outputs.version }}/' \
            deploy/k8s/overlays/staging/kustomization.yaml

          kubectl kustomize deploy/k8s/overlays/staging >/tmp/staging-rendered.yaml

      - name: Deploy to Staging
        run: |
          # Apply Kubernetes manifests
          kubectl apply -k deploy/k8s/overlays/staging

          # Wait for rollout
          kubectl rollout status deployment/bizra-elite -n bizra-staging --timeout=300s
          kubectl rollout status deployment/bizra-omega -n bizra-staging --timeout=300s
          kubectl rollout status deployment/bizra-frontend -n bizra-staging --timeout=120s

      - name: Verify Staging Deployment
        run: |
          # Health check
          kubectl wait --for=condition=ready pod -l app=bizra-elite -n bizra-staging --timeout=120s
          kubectl wait --for=condition=ready pod -l app=bizra-omega -n bizra-staging --timeout=120s
          kubectl wait --for=condition=ready pod -l app=bizra-frontend -n bizra-staging --timeout=60s

          # Get service endpoint
          STAGING_URL=$(kubectl get ingress -n bizra-staging -o jsonpath='{.items[0].spec.rules[0].host}')
          echo "Staging deployed at: https://${STAGING_URL}"

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 3: Smoke Tests on Staging
  # ═══════════════════════════════════════════════════════════════════════════
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build-push, deploy-staging, staging-bypass-audit]
    if: ${{ needs.deploy-staging.result == 'success' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8  # v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run Smoke Tests (Health + Status)
        run: |
          set -euo pipefail

          kubectl -n bizra-staging port-forward svc/bizra-elite 18080:80 >/tmp/bizra-elite-pf.log 2>&1 &
          PF_ELITE=$!
          kubectl -n bizra-staging port-forward svc/bizra-omega 13001:80 >/tmp/bizra-omega-pf.log 2>&1 &
          PF_OMEGA=$!

          cleanup() {
            kill "$PF_ELITE" "$PF_OMEGA" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 10

          curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:18080/v1/health
          curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:18080/v1/status
          curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:13001/api/v1/health
          curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:13001/api/v1/status

      - name: "PHASE77: API contract smoke (Terminal v1 endpoints)"
        run: |
          set -euo pipefail

          kubectl -n bizra-staging port-forward svc/bizra-elite 18080:80 >/tmp/bizra-elite-pf.log 2>&1 &
          PF_ELITE=$!
          trap "kill $PF_ELITE 2>/dev/null || true" EXIT
          sleep 5

          BASE="http://127.0.0.1:18080"
          PASSED=0
          FAILED=0

          check_endpoint() {
            local method=$1 path=$2 expected_status=$3
            local actual
            actual=$(curl -s -o /dev/null -w "%{http_code}" -X "$method" "$BASE$path" 2>/dev/null || echo "000")
            if echo "$expected_status" | grep -qw "$actual"; then
              echo "  [PASS] $method $path -> $actual"
              PASSED=$((PASSED + 1))
            else
              echo "  [FAIL] $method $path -> $actual (expected: $expected_status)"
              FAILED=$((FAILED + 1))
            fi
          }

          echo "=== Phase 77: Terminal v1 Public Endpoint Contract ==="
          check_endpoint GET "/v1/health" "200 500"
          check_endpoint GET "/v1/status" "200"
          check_endpoint GET "/v1/cognitive/status" "200"
          check_endpoint GET "/v1/token/supply" "200"
          check_endpoint GET "/v1/metrics" "200"
          check_endpoint GET "/v1/sat/stats" "200"

          echo ""
          echo "=== Phase 77: Auth Fail-Closed Contract ==="
          # Authenticated endpoints MUST return 401/403/503 without auth token
          check_endpoint GET "/v1/seed/potential" "401 403 503"
          check_endpoint GET "/v1/seed/episodes" "401 403 503"
          check_endpoint GET "/v1/node/value" "401 403 503"
          check_endpoint GET "/v1/node/lifecycle" "401 403 503"
          check_endpoint GET "/v1/network/effect" "401 403 503"
          check_endpoint GET "/v1/token/balance" "401 403 503"
          check_endpoint GET "/v1/memory/stats" "401 403 503"
          check_endpoint GET "/v1/onboarding/state" "401 403 503"
          check_endpoint GET "/v1/reflex/status" "401 403 503"

          echo ""
          echo "=== Phase 77: Verify Endpoints (public POST) ==="
          check_endpoint POST "/v1/verify/genesis" "200 422"

          echo ""
          echo "Phase 77 smoke: ${PASSED} passed, ${FAILED} failed"
          echo "## Phase 77: API Contract Smoke" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | ${PASSED} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${FAILED} |" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Phase 77 API contract smoke failed: ${FAILED} endpoint(s) broken in deployed container"
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 4: Quality Gate Validation (Production Gate)
  # ═══════════════════════════════════════════════════════════════════════════
  production-quality-gate:
    name: Production Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [smoke-tests]
    if: ${{ (github.event.inputs.environment == 'production' || github.event_name == 'release') && needs.smoke-tests.result == 'success' }}
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Verify CI Quality Gates Passed
        run: |
          echo "Checking CI workflow status for commit ${{ github.sha }}..."
          CI_STATUS=$(gh run list --commit ${{ github.sha }} --workflow ci.yml --json conclusion --jq '.[0].conclusion // "pending"' 2>/dev/null || echo "unknown")
          echo "CI workflow conclusion: $CI_STATUS"
          if [ "$CI_STATUS" != "success" ]; then
            echo "::error::CI quality gates have not passed for this commit (status: $CI_STATUS)."
            echo "::error::Production deployment requires CI to be green."
            exit 1
          fi
          echo "CI quality gates verified."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Production Quality Gate
        id: gate
        run: |
          python << 'EOF'
          import sys
          import os

          from core.integration.constants import (
              IHSAN_THRESHOLD_PRODUCTION,
              SNR_THRESHOLD_T1_HIGH,
          )

          print("=" * 70)
          print("PRODUCTION QUALITY GATE")
          print("=" * 70)
          print(f"Required Ihsan: {IHSAN_THRESHOLD_PRODUCTION}")
          print(f"Required SNR: {SNR_THRESHOLD_T1_HIGH}")
          print()

          smoke_tests_result = os.environ.get("SMOKE_TESTS_RESULT", "")
          is_release = os.environ.get('GITHUB_EVENT_NAME') == 'release'

          if smoke_tests_result != "success":
              print(f"[ERROR] Smoke tests are not successful: {smoke_tests_result!r}")
              approved = False
          elif is_release:
              print("[INFO] Release deployment - staging smoke tests validated")
              approved = True
          else:
              print("[INFO] Manual production deployment - staging smoke tests validated")
              approved = True

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"approved={'true' if approved else 'false'}\n")

          if not approved:
              print("\n[ERROR] Production quality gate failed!")
              sys.exit(1)

          print("\n[SUCCESS] Production quality gate passed!")
          EOF
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SMOKE_TESTS_RESULT: ${{ needs.smoke-tests.result }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 5: Deploy to Production
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-push, production-quality-gate]
    if: ${{ needs.production-quality-gate.outputs.approved == 'true' }}
    environment:
      name: production
      url: https://api.bizra.node0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8  # v3

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78  # v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install Argo Rollouts plugin
        run: |
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts-linux-amd64
          sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts
          kubectl argo rollouts version

      - name: Pre-deployment Backup
        run: |
          # Backup current deployment state
          kubectl get deployment -n bizra -o yaml > backup-deployments.yaml
          kubectl get configmap -n bizra -o yaml > backup-configmaps.yaml

          # Store backup as artifact
          mkdir -p backup
          mv backup-*.yaml backup/

      - name: Upload Backup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: production-backup-${{ github.sha }}
          path: backup/
          retention-days: 30

      - name: Deploy to Production (Argo Rollout Canary — ADR-012)
        run: |
          VERSION="${{ needs.build-push.outputs.version }}"

          # Inject immutable image tags into production overlay
          sed -i \
            -e "s/newTag: elite-placeholder/newTag: ${VERSION}/" \
            -e "s/newTag: omega-placeholder/newTag: ${VERSION}/" \
            -e "s/newTag: mcp-placeholder/newTag: ${VERSION}/" \
            -e "s/newTag: frontend-placeholder/newTag: ${VERSION}/" \
            deploy/k8s/overlays/production/kustomization.yaml

          # Render and validate before applying
          kubectl kustomize deploy/k8s/overlays/production >/tmp/production-rendered.yaml
          kubectl apply -k deploy/k8s/overlays/production --dry-run=server

          # Apply base resources (services, configmaps, HPA, NetworkPolicy)
          kubectl apply -k deploy/k8s/overlays/production

          # Update the Argo Rollout image (triggers canary progression)
          # ADR-012: 5% → 20% → 50% → 80% → 100% with SLO analysis at each step
          kubectl argo rollouts set image bizra-elite-rollout \
            bizra-elite=ghcr.io/${{ github.repository }}/elite:${VERSION} \
            -n bizra

          # Wait for rollout to reach stable (Argo manages the canary lifecycle)
          kubectl rollout status deployment/bizra-omega -n bizra --timeout=600s

      - name: Argo Rollout Canary Monitoring
        run: |
          # Monitor Argo Rollout canary progression
          echo "=== Argo Rollout Canary Status ==="
          kubectl argo rollouts status bizra-elite-rollout -n bizra --timeout 900s || {
            PHASE=$(kubectl argo rollouts status bizra-elite-rollout -n bizra 2>/dev/null | head -1)
            echo "::error::Argo Rollout failed at phase: ${PHASE}"

            # Abort the rollout (auto-reverts to stable)
            kubectl argo rollouts abort bizra-elite-rollout -n bizra
            echo "Rollout aborted — stable revision preserved."
            exit 1
          }

          echo "=== Canary promoted to stable ==="
          kubectl argo rollouts get rollout bizra-elite-rollout -n bizra --no-color

      - name: Verify Production Deployment
        run: |
          # Final health checks
          kubectl wait --for=condition=ready pod -l app=bizra-elite -n bizra --timeout=120s
          kubectl wait --for=condition=ready pod -l app=bizra-omega -n bizra --timeout=120s

          # Log deployment info
          echo "Production deployment complete!"
          kubectl get pods -n bizra
          kubectl get services -n bizra

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 6: Post-Deployment Verification
  # ═══════════════════════════════════════════════════════════════════════════
  verify-production:
    name: Verify Production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [deploy-production]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8  # v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Production Health Check
        run: |
          set -euo pipefail

          kubectl -n bizra port-forward svc/bizra-elite 18080:80 >/tmp/bizra-elite-prod-pf.log 2>&1 &
          PF_ELITE=$!
          kubectl -n bizra port-forward svc/bizra-omega 13001:80 >/tmp/bizra-omega-prod-pf.log 2>&1 &
          PF_OMEGA=$!

          cleanup() {
            kill "$PF_ELITE" "$PF_OMEGA" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 10

          echo "=== Core Health ==="
          curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:18080/v1/health
          curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:18080/v1/status
          curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:13001/api/v1/health
          curl --fail --retry 5 --retry-delay 3 http://127.0.0.1:13001/api/v1/status

          echo ""
          echo "=== Phase 77: Production Contract Spot-Check ==="
          # Public endpoints must respond (200)
          curl --fail --retry 3 --retry-delay 2 http://127.0.0.1:18080/v1/cognitive/status
          curl --fail --retry 3 --retry-delay 2 http://127.0.0.1:18080/v1/token/supply
          curl --fail --retry 3 --retry-delay 2 http://127.0.0.1:18080/v1/sat/stats

          # Auth endpoints must NOT return 200 without credentials (fail-closed)
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/v1/seed/potential)
          if [ "$AUTH_STATUS" = "200" ]; then
            echo "::error::SECURITY: /v1/seed/potential returned 200 without auth — fail-open vulnerability!"
            exit 1
          fi
          echo "Auth fail-closed verified (seed/potential returned $AUTH_STATUS without auth)"

      - name: Notify Success
        run: |
          echo "## Production Deployment Verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Core health | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| API contract (public) | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Auth fail-closed | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production deployment verified successfully!"

  # ═══════════════════════════════════════════════════════════════════════════
  # Rollback (Manual Trigger)
  # ═══════════════════════════════════════════════════════════════════════════
  rollback:
    name: Rollback Production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' && failure() }}
    needs: [deploy-production]
    steps:
      - name: Install kubectl + Argo Rollouts plugin
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts-linux-amd64
          sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts

      - name: Execute Rollback (Argo Rollout + Omega Deployment)
        run: |
          echo "Initiating rollback..."

          # Argo Rollout: undo promotes previous stable revision
          kubectl argo rollouts undo bizra-elite-rollout -n bizra 2>/dev/null || \
            kubectl rollout undo deployment/bizra-elite -n bizra

          # Standard Deployment rollback for Omega
          kubectl rollout undo deployment/bizra-omega -n bizra

          # Wait for rollback completion
          kubectl argo rollouts status bizra-elite-rollout -n bizra --timeout 300s 2>/dev/null || \
            kubectl rollout status deployment/bizra-elite -n bizra --timeout=300s
          kubectl rollout status deployment/bizra-omega -n bizra --timeout=300s

          echo "Rollback complete!"

      - name: Verify Rollback
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n bizra -o wide

          echo "=== Argo Rollout Status ==="
          kubectl argo rollouts get rollout bizra-elite-rollout -n bizra --no-color 2>/dev/null || true

          echo "=== Health Check ==="
          kubectl -n bizra port-forward svc/bizra-elite 18080:80 >/dev/null 2>&1 &
          PF=$!; trap "kill $PF 2>/dev/null || true" EXIT; sleep 5
          curl --fail --retry 3 --retry-delay 2 http://127.0.0.1:18080/v1/health
          echo "Rollback verified — production healthy."
