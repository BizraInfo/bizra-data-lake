[package]
name = "bizra-proofspace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "BIZRA Proof Space Validator - Life/death judgments for civilization-grade blocks"
keywords = ["proof", "validation", "smt", "z3", "sovereignty"]
categories = ["cryptography", "science"]

[dependencies]
# BIZRA core — canonical constants (IHSAN_THRESHOLD, etc.)
bizra-core = { path = "../bizra-core" }

# Cryptography - workspace inherited
blake3.workspace = true
ed25519-dalek = { workspace = true, features = ["serde", "rand_core"] }
rand.workspace = true

# Serialization - workspace inherited
serde.workspace = true
serde_json.workspace = true

# RFC 8785 JCS Canonicalization
json-canon = "0.1"

# Async - workspace inherited
tokio.workspace = true
async-trait.workspace = true

# Error handling - workspace inherited
thiserror.workspace = true
anyhow.workspace = true

# Time & Identity - workspace inherited
chrono.workspace = true
uuid.workspace = true

# Logging - workspace inherited
tracing.workspace = true

# Regex for validation
regex = "1.10"

# Lazy initialization
once_cell = "1.19"

# Hex encoding
hex = "0.4"
# ━━━ Sprint 2: Proof Pyramid Wires (W4, W5, W8) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# W4: receipt_chain.rs needs ActionId, IhsanScore, Channel, ReceiptChain
bizra-action = { path = "../bizra-action", features = ["production"] }
# W5: mission_bridge.rs needs Mission, MissionState, MissionReceipt
bizra-mission = { path = "../bizra-mission" }
# W8: receipt_chain.rs + fate_proof.rs need RegularNumber, SipparError
bizra-sippar = { path = "../bizra-sippar" }

[dev-dependencies]
tokio-test = "0.4"
# ━━━ Sprint 2: Fate-Binding Wire (W7) — dev-dep until CI pins Z3 ━━━━━━━━━━━━
fate-binding = { path = "../fate-binding" }
criterion = "0.5"

[[bin]]
name = "proofspace-validator"
path = "src/main.rs"

[features]
default = []
# Enable Z3 SMT solver integration
z3 = []
# Enable parallel validation
parallel = ["rayon"]

[dependencies.rayon]
version = "1.8"
optional = true

[[bench]]
name = "proofspace_benchmark"
harness = false

# ━━━ Sprint 2: Proof Pyramid Criterion Benchmarks ━━━━━━━━━━━━━━━━━━━━━━━━━━━
[[bench]]
name = "proof_pyramid_bench"
harness = false
