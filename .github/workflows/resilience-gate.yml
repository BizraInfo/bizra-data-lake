# BIZRA Resilience Gate — Pre-Merge Quality Assurance
# ADR-012: Frontend vulnerability gating + E2E validation + evidence bundle
#
# Triggers: PR to main, manual dispatch
# Gates:
#   1. Frontend vulnerability scan (npm audit)
#   2. Playwright E2E smoke tests
#   3. Release evidence bundle generation
#
# Standing on Giants: Playwright | npm audit | OWASP | Shannon (SNR verification)

name: Resilience Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'filedfs/**'
      - 'frontend/**'
      - 'core/**'
      - 'deploy/**'
      - 'tests/e2e/**'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run E2E tests'
        default: true
        type: boolean

concurrency:
  group: resilience-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Gate 1: Frontend Vulnerability Scan
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-vuln-scan:
    name: Frontend Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: filedfs
        run: npm install --ignore-scripts

      - name: npm audit (high + critical)
        working-directory: filedfs
        run: |
          set +e
          npm audit --audit-level=high --json > /tmp/npm-audit.json 2>&1
          AUDIT_EXIT=$?
          set -e

          # Parse results
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' /tmp/npm-audit.json 2>/dev/null || echo 0)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' /tmp/npm-audit.json 2>/dev/null || echo 0)

          echo "## Frontend Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::$CRITICAL critical vulnerabilities found in frontend dependencies"
            exit 1
          fi

          if [ "$HIGH" -gt 0 ]; then
            echo "::warning::$HIGH high vulnerabilities found — review required"
          fi

          echo "Frontend vulnerability scan passed"

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: npm-audit-results
          path: /tmp/npm-audit.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Gate 2: Backend Safety Check
  # ═══════════════════════════════════════════════════════════════════════════
  backend-safety:
    name: Backend Safety Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install bandit pip-audit

      - name: Bandit security scan
        run: |
          set +e
          bandit -r core/ -f json -q -o /tmp/bandit.json 2>&1
          BANDIT_EXIT=$?
          set -e

          HIGH=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('/tmp/bandit.json'))
              print(sum(1 for r in data.get('results', []) if r.get('issue_severity') == 'HIGH'))
          except Exception:
              print(0)
          ")

          echo "## Backend Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "High severity issues: $HIGH" >> $GITHUB_STEP_SUMMARY

          if [ "$HIGH" -gt 0 ]; then
            echo "::error::$HIGH high-severity bandit findings in core/"
            exit 1
          fi

      - name: pip-audit
        continue-on-error: true
        run: |
          pip-audit --desc --fix --dry-run 2>&1
          echo "pip-audit check complete"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-safety-results
          path: /tmp/bandit.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Gate 3: Playwright E2E Smoke Tests
  # ═══════════════════════════════════════════════════════════════════════════
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.event.inputs.run_e2e != 'false' }}
    needs: [frontend-vuln-scan, backend-safety]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          cd tests/e2e
          npm init -y
          npm install @playwright/test
          npx playwright install --with-deps chromium

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps and start server
        env:
          # Canary smoke validates that core API endpoints serve a 200 from an
          # unauthenticated probe (Argo Rollouts canary AnalysisTemplate, K8s
          # liveness/readiness equivalents). The auth-hardened endpoints
          # (/v1/health, /v1/status) require a token in production. We enable
          # the dev-only anonymous-auth flag here. core/auth/middleware.py
          # _anonymous_auth_allowed() forcibly ignores this flag when
          # BIZRA_ENV=production, so flipping it on in CI cannot leak into a
          # real deployment.
          BIZRA_AUTH_ALLOW_ANONYMOUS: "true"
          BIZRA_ENV: "ci"
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
          # Start API server in background for E2E tests
          BIZRA_AUTH_ALLOW_ANONYMOUS=true BIZRA_ENV=ci \
            python -m core.sovereign serve --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server to be ready (use unauth liveness probe so the
          # readiness loop never confuses a stuck server with an auth 401)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/v1/health/live >/dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Playwright E2E tests
        working-directory: tests/e2e
        run: npx playwright test canary-smoke.spec.ts --reporter=json
        env:
          BASE_URL: http://localhost:8000
          CI: true

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: e2e-results
          path: tests/e2e/results/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════════════════
  # Gate 4: Release Evidence Bundle
  # ═══════════════════════════════════════════════════════════════════════════
  evidence-bundle:
    name: Evidence Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [frontend-vuln-scan, backend-safety]
    if: always()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate evidence bundle
        run: |
          VERSION="sha-${{ github.sha }}"
          VERDICT="pending"

          # Determine verdict from gate results
          if [[ "${{ needs.frontend-vuln-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-safety.result }}" == "failure" ]]; then
            VERDICT="rolled-back"
          fi

          python scripts/release_evidence_bundle.py \
            --version "$VERSION" \
            --rollout-verdict "$VERDICT" \
            --output-dir deploy/evidence
        continue-on-error: true

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-evidence-${{ github.sha }}
          path: deploy/evidence/
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════
  # Summary Gate — All gates must pass
  # ═══════════════════════════════════════════════════════════════════════════
  resilience-verdict:
    name: Resilience Verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [frontend-vuln-scan, backend-safety, e2e-smoke, evidence-bundle]
    if: always()
    steps:
      - name: Evaluate gates
        run: |
          echo "## Resilience Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Vuln Scan | ${{ needs.frontend-vuln-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Safety | ${{ needs.backend-safety.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Smoke | ${{ needs.e2e-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Evidence Bundle | ${{ needs.evidence-bundle.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=0
          if [[ "${{ needs.frontend-vuln-scan.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.backend-safety.result }}" == "failure" ]]; then FAILED=1; fi
          if [[ "${{ needs.e2e-smoke.result }}" == "failure" ]]; then FAILED=1; fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Resilience gate FAILED — merge blocked"
            echo "> **BLOCKED**: One or more resilience gates failed." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "> **PASSED**: All resilience gates green." >> $GITHUB_STEP_SUMMARY
          echo "Resilience gate PASSED"
