# BIZRA Quality Spine CI
# Single workflow routing all quality enforcement through scripts/quality_spine.py
#
# Replaces: quality-management.yml (which called 5 separate scripts)
# Architecture: RATCHET → TREND → GATES → CHANGELOG → EVIDENCE
#
# Standing on Giants:
# - Deming (PDCA quality cycle, 1950)
# - Shewhart (control charts, 1924)
# - PMI/PMBOK 7th Ed (Quality Management, 2021)

name: Quality Spine

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      apply_ratchet:
        description: 'Apply coverage ratchet (bump floor on main)'
        required: false
        default: 'false'
        type: boolean
      skip_gates:
        description: 'Comma-separated gate names to skip'
        required: false
        default: ''
        type: string

env:
  PYTHON_VERSION: '3.12'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 1: Coverage + Ratchet
  # ═══════════════════════════════════════════════════════════════════════════
  ratchet:
    name: "📈 Coverage Ratchet"
    runs-on: ubuntu-24.04
    outputs:
      actual_coverage: ${{ steps.ratchet.outputs.actual_coverage }}
      current_floor: ${{ steps.ratchet.outputs.current_floor }}
      ratcheted: ${{ steps.ratchet.outputs.ratcheted }}
      new_floor: ${{ steps.ratchet.outputs.new_floor }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage[toml]
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=core --cov-report=xml:coverage.xml --cov-report=term-missing \
            -m "not requires_ollama and not requires_gpu and not slow and not e2e_http" \
            --timeout=60 -q || true

      - name: Spine → Ratchet
        id: ratchet
        run: |
          OUTPUT=$(python scripts/quality_spine.py ratchet \
            --coverage-xml coverage.xml \
            --pyproject pyproject.toml \
            --json 2>/dev/null || echo '{}')
          echo "$OUTPUT"
          echo "actual_coverage=$(echo "$OUTPUT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('actual_coverage',0))" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          echo "current_floor=$(echo "$OUTPUT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('current_floor',38))" 2>/dev/null || echo 38)" >> "$GITHUB_OUTPUT"
          echo "ratcheted=$(echo "$OUTPUT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('ratcheted',False))" 2>/dev/null || echo False)" >> "$GITHUB_OUTPUT"
          echo "new_floor=$(echo "$OUTPUT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('new_floor','none'))" 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Regression check
        run: |
          if [ ! -f coverage.xml ]; then
            echo "::warning::coverage.xml not generated — tests may have failed to collect"
            exit 0
          fi
          python scripts/quality_spine.py ratchet \
            --coverage-xml coverage.xml \
            --pyproject pyproject.toml

      - name: Apply ratchet (main only)
        if: github.ref == 'refs/heads/main' && github.event.inputs.apply_ratchet == 'true'
        run: |
          python scripts/quality_spine.py ratchet \
            --coverage-xml coverage.xml \
            --pyproject pyproject.toml \
            --apply

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 2: Trend Snapshot
  # ═══════════════════════════════════════════════════════════════════════════
  trend:
    name: "📊 Quality Trend"
    runs-on: ubuntu-24.04
    needs: [ratchet]
    outputs:
      direction: ${{ steps.analyze.outputs.direction }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4
        with:
          path: 04_GOLD/quality_trend.jsonl
          key: quality-trend-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            quality-trend-${{ github.ref_name }}-

      - name: Spine → Trend Record
        env:
          ACTUAL_COVERAGE: ${{ needs.ratchet.outputs.actual_coverage }}
        run: |
          python scripts/quality_spine.py trend record \
            --snr 0.0 \
            --coverage "${ACTUAL_COVERAGE:-0}"

      - name: Spine → Trend Analyze
        id: analyze
        run: |
          DIRECTION=$(python scripts/quality_spine.py trend analyze --json 2>/dev/null \
            | python -c "import sys,json; print(json.load(sys.stdin).get('direction','unknown'))" 2>/dev/null || echo unknown)
          echo "direction=$DIRECTION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: quality-trend
          path: 04_GOLD/quality_trend.jsonl
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Full Spine Enforcement (gates + verdict)
  # ═══════════════════════════════════════════════════════════════════════════
  enforce:
    name: "🔒 Spine Enforce"
    runs-on: ubuntu-24.04
    needs: [ratchet, trend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff mypy bandit

      - name: Spine → Enforce
        env:
          SKIP_GATES: ${{ github.event.inputs.skip_gates }}
        run: |
          SKIP_ARG=""
          if [ -n "$SKIP_GATES" ]; then
            SKIP_ARG="--skip $SKIP_GATES"
          fi
          python scripts/quality_spine.py enforce \
            --workspace . \
            --coverage-xml coverage.xml \
            --pyproject pyproject.toml \
            $SKIP_ARG \
            --json

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 4: PR Summary
  # ═══════════════════════════════════════════════════════════════════════════
  pr-summary:
    name: "📋 PR Summary"
    runs-on: ubuntu-24.04
    needs: [ratchet, trend]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true

      - name: Spine → PR Summary
        env:
          ACTUAL_COVERAGE: ${{ needs.ratchet.outputs.actual_coverage }}
          CURRENT_FLOOR: ${{ needs.ratchet.outputs.current_floor }}
          RATCHETED: ${{ needs.ratchet.outputs.ratcheted }}
          NEW_FLOOR: ${{ needs.ratchet.outputs.new_floor }}
          TREND_DIR: ${{ needs.trend.outputs.direction }}
        run: |
          NF_ARG=""
          if [ "$RATCHETED" = "True" ] && [ "$NEW_FLOOR" != "none" ]; then
            NF_ARG="--new-floor $NEW_FLOOR"
          fi
          python scripts/quality_spine.py summary \
            --coverage "${ACTUAL_COVERAGE:-0}" \
            --floor "${CURRENT_FLOOR:-38}" \
            --commit "${{ github.sha }}" \
            --output /tmp/pr_summary.md \
            $NF_ARG

      - uses: marocchino/sticky-pull-request-comment@331f8f5b4215f0445d3c07b4967662a32a2d3e31  # v2
        with:
          path: /tmp/pr_summary.md

  # ═══════════════════════════════════════════════════════════════════════════
  # STAGE 5: Release Changelog (tag pushes only)
  # ═══════════════════════════════════════════════════════════════════════════
  changelog:
    name: "📝 Changelog"
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true

      - name: Spine → Changelog
        run: |
          python scripts/quality_spine.py changelog \
            --from-tag "${{ github.ref_name }}" > /tmp/changelog.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release-changelog
          path: /tmp/changelog.md
          retention-days: 365
