; BIZRA AHK Bridge Configuration
; ============================================================
; This file configures the desktop bridge server (ahk_bridge.ahk)
; that listens for JSON-RPC 2.0 commands from bizra-node.
;
; Connection: bizra-node → TCP:9742 → ahk_bridge.ahk
; Auth: BIZRA_BRIDGE_TOKEN env var (shared secret)
; ============================================================

[bridge]
; TCP port to listen on (default: 9742)
port=9742

; Directory containing skill scripts (.ahk files)
; Relative paths resolve from ahk_bridge.ahk location
skills_dir=skills

; Allow "execute" intent (Run command) — DANGEROUS
; Set to "true" only in trusted environments
allow_run=false

; Comma-separated allowlist of target_app window titles
; Empty = allow any target app
; Example: app_allowlist=Notepad,Calculator,File Explorer
app_allowlist=
