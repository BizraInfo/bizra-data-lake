[package]
name = "bizra-cognition-gateway"
version = "0.1.0"
edition = "2021"
description = "HTTP projection of bizra-cognition runtime state + dema CLI client"

[dependencies]
bizra-cognition = { path = "../bizra-cognition" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
axum = "0.7"
clap = { version = "4.5", features = ["derive", "color"] }
reqwest = { workspace = true }
anyhow = { workspace = true }
# Spearpoint A — Rust→TypeScript binding generation. Bindings are
# checked in at bindings/; `cargo test` regenerates them; CI fails on
# unstaged diff. UI consumers import from that directory.
ts-rs = { version = "10", features = ["no-serde-warnings"] }
# Cycle-8 Day 5 — Ed25519 signatures on WitnessObservation.
# Workspace-pinned to 2.1 with features [serde, rand_core, batch].
ed25519-dalek = { workspace = true }
# Random number generation for test-time key creation; production keys
# load from BIZRA_WITNESS_SIGNING_KEY_HEX env var.
rand = { workspace = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
serde_json = { workspace = true }
tempfile = "3.10"

[[bin]]
name = "bizra-cognition-gateway"
path = "src/main.rs"

[[bin]]
name = "dema"
path = "src/bin/dema.rs"
