[workspace]
resolver = "2"
members = [
    # ━━━ Platform Layer (original bizra-omega) ━━━
    "bizra-core",
    "bizra-hypergraph",
    "bizra-inference",
    "bizra-autopoiesis",
    "bizra-federation",
    "bizra-installer",
    "bizra-python",
    "bizra-api",
    "bizra-tests",
    "bizra-hunter",
    "bizra-telescript",
    "bizra-proofspace",
    "bizra-resourcepool",
    "bizra-cli",
    # ━━━ Node0 Cognitive Layer (merged from native/) ━━━
    "bizra-hooks",
    "bizra-memory",
    # ━━━ Action Bus (muscle system — Event→Action→Receipt) ━━━
    "bizra-action",
    # ━━━ TTRL Layer (four-paper upgrades — Chain of Reasoning, Engram, SSO, TTRL) ━━━
    "bizra-ttrl",
    # ━━━ Desktop Node Layer (sovereign agent + binary) ━━━
    "bizra-agent",
    "bizra-node",
    # ━━━ Advanced Bindings ━━━
    "fate-binding",
    "iceoryx-bridge",
    # ━━━ Exact Arithmetic (Sippar Protocol — Babylonian regular numbers) ━━━
    "bizra-sippar",
    # ━━━ Mission Control Plane (sovereign lifecycle for every cognitive operation) ━━━
    "bizra-mission",
    # ━━━ Protocol Layer (the 26th crate — wires 25 organs into one living system) ━━━
    "bizra-protocol",
    # ━━━ Cognition Substrate (dual-rate thought graph + receipted runtime) ━━━
    "bizra-cognition",
    # ━━━ Cognition Gateway (read-only HTTP projection for Dema Console) ━━━
    "bizra-cognition-gateway",
]
exclude = [
    # UEFI crate — different target (x86_64-unknown-uefi), built standalone
    "bizra-efi",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["BIZRA Sovereign <sovereign@bizra.node0>"]
license = "MIT"

[workspace.dependencies]
# Cryptography (with batch verification for SIMD)
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core", "batch"] }
blake3 = { version = "1.5", features = ["rayon"] }
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async Runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time & Identity
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

# Network
reqwest = { version = "0.12", features = ["json", "blocking"] }
async-trait = "0.1"

# SIMD acceleration
rayon = "1.8"

# ━━━ Node.js FFI (fate-binding, iceoryx-bridge) ━━━
napi = { version = "2.14", features = ["async", "napi8"] }
napi-derive = "2.14"

# ━━━ Formal Verification (fate-binding) ━━━
z3 = "0.12"

# ━━━ Post-Quantum Crypto (fate-binding) ━━━
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"
hex = "0.4"

# ━━━ IPC (iceoryx-bridge) ━━━
iceoryx2 = "0.4"
rmp-serde = "1.1"
memmap2 = "0.9"

# ━━━ Testing ━━━
tempfile = "3.10"

# ━━━ Benchmarking ━━━
criterion = "0.5"

# Pinned transitive deps — security floor
bytes = ">=1.11.1"  # Fix RUSTSEC-2026-0007

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"

[profile.release.build-override]
opt-level = 3

# Maximum optimization profile with AVX-512
# Run with: RUSTFLAGS="-C target-cpu=native" cargo build --profile omega
[profile.omega]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

# ━━━ cargo-dist packaging — Cycle-8 Day 3 ━━━
#
# Distribution config for the First Fire launch binaries.
# Only bizra-cognition-gateway ships; it is the single crate that
# produces both the HTTP gateway server (src/main.rs) AND the `dema`
# CLI (src/bin/dema.rs) as [[bin]] targets. All other workspace
# members remain internal crates and are NOT published by cargo-dist.
#
# Validation requires `cargo install cargo-dist && cargo dist check`.
# This config was hand-written (equivalent to `cargo dist init` output)
# to avoid a global cargo install during Day 3 packaging preflight.
#
[workspace.metadata.dist]
cargo-dist-version = "0.23.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Only the gateway crate ships binaries. All other workspace members stay internal.
packages = ["bizra-cognition-gateway"]
# CI preflight mode: validate packaging on PRs without publishing.
pr-run-mode = "plan"
allow-dirty = ["ci"]
