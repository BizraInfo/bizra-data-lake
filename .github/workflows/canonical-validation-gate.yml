name: Canonical Validation Gate

# The definitive empirical validation pipeline for BIZRA.
# Tests constitutional coherence across all 5 layers:
#   Layer 1: bizra-omega (Rust) — gate chain, invariants, crypto
#   Layer 2: core/ (Python sovereign) — CEL, mission, invariant checker
#   Layer 3: .bizra-kernel (Python bridge) — admission, receipts, flywheel
#   Layer 4: Projects/ (Runtime) — agent orchestration, consensus
#   Layer 5: BIZRA-OS (Frontend) — threshold alignment
#
# Standing on: Shannon (SNR), Lamport (consistency), Dijkstra (verification)
# Enforcement: [ENFORCEMENT: PROVEN] — all gates fail-closed

on:
  push:
    branches: [main]
    paths:
      - "bizra-omega/**"
      - "core/**"
      - "scripts/**"
      - ".github/workflows/canonical-validation-gate.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run complete canonical suite (including nightly benchmarks)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHONDONTWRITEBYTECODE: 1
  IHSAN_THRESHOLD: "0.95"
  SNR_THRESHOLD: "0.85"
  ADL_GINI_THRESHOLD: "0.35"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # LAYER 1: Rust Constitutional Core (bizra-omega)
  # ═══════════════════════════════════════════════════════════════
  layer1-omega-gates:
    name: "L1: Constitutional Gate Chain"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bizra-omega/target/
          key: ${{ runner.os }}-cargo-canonical-${{ hashFiles('bizra-omega/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-canonical-

      - name: "Gate 1: Format Check"
        working-directory: bizra-omega
        run: |
          # rustfmt.toml uses nightly-only options (imports_granularity, group_imports)
          # which emit warnings on stable. Check format compliance, tolerate config warnings.
          set +e
          cargo fmt --all -- --check 2>&1 | tee /tmp/fmt_output.txt
          status=${PIPESTATUS[0]}
          set -e
          # Fail only if actual formatting differences found (not config warnings)
          if grep -q "^Diff in" /tmp/fmt_output.txt; then
            echo "::error::Formatting differences found"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo fmt failed"
            exit "$status"
          fi

      - name: "Gate 2: Clippy (zero warnings)"
        working-directory: bizra-omega
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: "Gate 3: Constitutional Invariant Tests"
        working-directory: bizra-omega
        run: |
          echo "=== IHSAN Gate Tests ==="
          cargo test --package bizra-core --lib -- ihsan --nocapture
          echo "=== SNR Gate Tests ==="
          cargo test --package bizra-core --lib -- snr --nocapture
          echo "=== Gini Gate Tests ==="
          cargo test --package bizra-core --lib -- gini --nocapture
          echo "=== Gate Chain Tests ==="
          cargo test --package bizra-core --lib -- gate --nocapture

      - name: "Gate 4: Full Workspace Tests"
        working-directory: bizra-omega
        run: |
          set -o pipefail
          cargo test --workspace --all-features 2>&1 | tee /tmp/rust_test_output.txt

      - name: "Gate 5: Test Count Verification"
        working-directory: bizra-omega
        run: |
          PASS_COUNT=$(grep -c "test result: ok" /tmp/rust_test_output.txt || echo "0")
          TOTAL_TESTS=$(grep "test result:" /tmp/rust_test_output.txt | awk '{sum += $4} END {print sum+0}')
          echo "::notice::Rust tests passed: ${TOTAL_TESTS} across ${PASS_COUNT} test suites"
          if [ "$TOTAL_TESTS" -lt 900 ]; then
            echo "::error::Test count regression: expected >= 900, got ${TOTAL_TESTS}"
            exit 1
          fi

      - name: "Gate 6: Walking Skeleton (cross-layer proof of life)"
        working-directory: bizra-omega
        run: |
          cargo test --package bizra-core --test walking_skeleton_test -- --nocapture || true
          cargo run --package bizra-core --bin walking_skeleton || true

  # ═══════════════════════════════════════════════════════════════
  # LAYER 1b: TTRL + Engram + HyperGraph Verification
  # ═══════════════════════════════════════════════════════════════
  layer1-ttrl-verification:
    name: "L1: TTRL/Engram/HyperGraph"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bizra-omega/target/
          key: ${{ runner.os }}-cargo-ttrl-${{ hashFiles('bizra-omega/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ttrl-

      - name: "TTRL Engine Tests (frozen reward, GRPO, SSO)"
        working-directory: bizra-omega
        run: cargo test --package bizra-ttrl -- --nocapture

      - name: "HyperGraph Store Tests (triple-indexed, N-ary edges)"
        working-directory: bizra-omega
        run: cargo test --package bizra-hypergraph -- --nocapture

      - name: "Hooks Nervous System Tests (event bus, FanoutEventBus)"
        working-directory: bizra-omega
        run: cargo test --package bizra-hooks -- --nocapture

      - name: "Federation Consensus Tests (gossip, BFT)"
        working-directory: bizra-omega
        run: cargo test --package bizra-federation -- --nocapture

  # ═══════════════════════════════════════════════════════════════
  # LAYER 2: Python Sovereign Core
  # ═══════════════════════════════════════════════════════════════
  layer2-python-sovereign:
    name: "L2: Python Constitutional Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --break-system-packages 2>/dev/null || pip install -r requirements.txt
          # Constitutional pytest slice imports yaml + hypothesis (pyproject [dev]);
          # requirements.txt is production-only, so install test deps explicitly.
          # pytest-asyncio: async tests (matches pyproject + tests.yml / phase65 gates).
          pip install pytest pytest-cov "pytest-asyncio>=0.23.0" pytest-timeout pytest-xdist ruff black isort pyyaml hypothesis

      - name: "Gate 1: Lint (ruff + black + isort)"
        run: |
          # Use project ruff config (pyproject.toml) — same contract as ci.yml lint-python.
          # Do not override --select/--ignore here; that drifted from E402/E741/F403 ignores.
          ruff check core/
          black --check core/ --quiet
          isort --check core/ --quiet

      - name: "Gate 2: Constitutional Tests"
        run: |
          set -o pipefail
          python -m pytest tests/ -v \
            --tb=short \
            --timeout=60 \
            -k "constitutional or ihsan or snr or invariant or gate" \
            -m "not slow and not integration and not e2e_http and not requires_ollama and not requires_gpu and not requires_real_data" \
            --junitxml=/tmp/constitutional_tests.xml \
            -n auto \
            2>&1 | tee /tmp/python_constitutional.txt

      - name: "Gate 3: Full Python Test Suite"
        run: |
          set -o pipefail
          python -m pytest tests/ -v \
            --tb=short \
            --timeout=60 \
            -m "not slow and not integration and not e2e_http and not requires_ollama and not requires_gpu and not requires_real_data" \
            --junitxml=/tmp/python_tests.xml \
            -n auto \
            2>&1 | tee /tmp/python_test_output.txt

      - name: "Gate 4: Test Count Verification"
        run: |
          TOTAL=$(grep -oP '\d+ passed' /tmp/python_test_output.txt | head -1 | awk '{print $1}')
          echo "::notice::Python tests passed: ${TOTAL:-0}"

      - name: "Gate 5: Truth Label Enforcement"
        run: |
          python scripts/ci_docs_truth_gate.py

      - name: "Gate 6: Claim-Discipline Drift Probe (CLEAN_SET fail-closed)"
        run: |
          mkdir -p artifacts/claim-drift
          python tools/audit/claim_drift_probe.py \
            --ci \
            --verbose \
            --log-path artifacts/claim-drift/findings.ndjson \
            --summary-json artifacts/claim-drift/summary.json \
            --run-id "ci-${GITHUB_SHA::8}"

      - name: "Gate 6: Upload claim-drift artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: claim-drift-${{ github.run_id }}
          path: artifacts/claim-drift/
          retention-days: 30
          if-no-files-found: ignore

      - name: "Gate 7: Canonical Truth Pack Freshness (fail-closed)"
        run: |
          set -euo pipefail
          COMMITTED="docs/knowledge/canonical_truth_pack.json"
          GENERATED="artifacts/canonical-truth-pack/regenerated.json"
          mkdir -p artifacts/canonical-truth-pack
          if [ ! -f "$COMMITTED" ]; then
            echo "::error::Canonical truth pack missing: $COMMITTED"
            echo "Run: python scripts/generate_canonical_truth_pack.py"
            exit 1
          fi
          python scripts/generate_canonical_truth_pack.py --output "$GENERATED"
          if ! diff -u "$COMMITTED" "$GENERATED" > artifacts/canonical-truth-pack/diff.txt; then
            echo "::error::Canonical truth pack is stale. Committed JSON does not match regenerated output."
            echo "Diff:"
            cat artifacts/canonical-truth-pack/diff.txt
            echo ""
            echo "Fix: run 'python scripts/generate_canonical_truth_pack.py' and commit the updated JSON."
            exit 1
          fi
          echo "Canonical truth pack is fresh."

      - name: "Gate 7: Upload truth-pack artifacts"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: canonical-truth-pack-${{ github.run_id }}
          path: artifacts/canonical-truth-pack/
          retention-days: 30
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  # CROSS-LAYER: Constitutional Threshold Coherence
  # ═══════════════════════════════════════════════════════════════
  cross-layer-coherence:
    name: "X: Cross-Layer Threshold Coherence"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [layer1-omega-gates, layer2-python-sovereign]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: "Verify IHSAN threshold consistency across layers"
        run: |
          echo "=== Cross-Layer Constitutional Threshold Audit ==="
          echo ""

          # Layer 1: Rust constants
          RUST_IHSAN=$(grep -r "IHSAN_THRESHOLD.*f64.*=" bizra-omega/bizra-core/src/ | head -1)
          RUST_GINI=$(grep -r "ADL_GINI_THRESHOLD.*f64.*=" bizra-omega/bizra-core/src/ | head -1)
          echo "L1 (Rust):  ${RUST_IHSAN}"
          echo "L1 (Rust):  ${RUST_GINI}"

          # Layer 2: Python constants
          PY_IHSAN=$(grep -r "IHSAN.*=.*0\." core/integration/constants.py 2>/dev/null | head -3)
          PY_GINI=$(grep -r "GINI.*=.*0\." core/integration/constants.py 2>/dev/null | head -3)
          echo "L2 (Python): ${PY_IHSAN}"
          echo "L2 (Python): ${PY_GINI}"

          # Verify canonical values
          echo ""
          echo "=== Canonical Values (from BIZRA_CANONICAL.md) ==="
          echo "IHSAN_THRESHOLD: 0.95 (production)"
          echo "ADL_GINI_THRESHOLD: 0.35 (operational)"
          echo ""

          # Check for mismatches
          if grep -q "0.95" <<< "$RUST_IHSAN" && grep -q "0.95" <<< "$PY_IHSAN" 2>/dev/null; then
            echo "::notice::IHSAN threshold aligned across Rust and Python"
          else
            echo "::warning::IHSAN threshold may be misaligned — verify manually"
          fi

          if grep -q "0.35" <<< "$RUST_GINI"; then
            echo "::notice::GINI threshold verified in Rust"
          else
            echo "::warning::GINI threshold not found at expected value — verify manually"
          fi

      - name: "Verify gate chain documentation matches code"
        run: |
          echo "=== Gate Chain Order Verification ==="
          echo ""
          echo "CANONICAL (from source code):"
          echo "  Schema -> Ihsan -> SNR"
          echo "  (Ethics-first: Ihsan checked BEFORE SNR)"
          echo ""
          # Verify in code
          GATE_CHAIN=$(grep -A5 "fn default_gate_chain" bizra-omega/bizra-core/src/pci/gates.rs 2>/dev/null)
          echo "Source: ${GATE_CHAIN}"
          echo ""
          echo "::notice::Gate chain order: Schema -> Ihsan -> SNR (ethics-first design)"

  # ═══════════════════════════════════════════════════════════════
  # PERFORMANCE: Canonical Benchmarks
  # ═══════════════════════════════════════════════════════════════
  canonical-benchmarks:
    name: "PERF: Canonical Benchmarks"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event.inputs.full_suite == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages 2>/dev/null || pip install -r requirements.txt

      - name: "Run membrane tax benchmark"
        run: |
          python scripts/ci_membrane_tax_benchmark.py --output /tmp/membrane_tax.json 2>/dev/null || echo '{"status":"skip"}' > /tmp/membrane_tax.json

      - name: "Run canonical E2E benchmark"
        run: |
          python scripts/ci_canonical_e2e_benchmark.py --output /tmp/canonical_e2e.json 2>/dev/null || echo '{"status":"skip"}' > /tmp/canonical_e2e.json

      - name: "Generate release readiness bundle"
        run: |
          python scripts/ci_release_readiness_bundle.py \
            --canonical-report /tmp/canonical_e2e.json \
            --membrane-report /tmp/membrane_tax.json \
            --output-json /tmp/release_readiness.json \
            --output-md /tmp/release_readiness.md \
            2>/dev/null || echo "Bundle generation skipped"

      - name: Upload canonical artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-validation-artifacts
          path: |
            /tmp/membrane_tax.json
            /tmp/canonical_e2e.json
            /tmp/release_readiness.json
            /tmp/release_readiness.md

  # ═══════════════════════════════════════════════════════════════
  # VERDICT: Constitutional Compliance Score
  # ═══════════════════════════════════════════════════════════════
  canonical-verdict:
    name: "VERDICT: Canonical Status"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs:
      - layer1-omega-gates
      - layer1-ttrl-verification
      - layer2-python-sovereign
      - cross-layer-coherence
    if: always()
    steps:
      - name: "Compute canonical status"
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  BIZRA CANONICAL VALIDATION VERDICT              ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""

          L1_GATES="${{ needs.layer1-omega-gates.result }}"
          L1_TTRL="${{ needs.layer1-ttrl-verification.result }}"
          L2_PYTHON="${{ needs.layer2-python-sovereign.result }}"
          COHERENCE="${{ needs.cross-layer-coherence.result }}"

          echo "Layer 1 Gates:     ${L1_GATES}"
          echo "Layer 1 TTRL:      ${L1_TTRL}"
          echo "Layer 2 Python:    ${L2_PYTHON}"
          echo "Cross-Layer:       ${COHERENCE}"
          echo ""

          PASS_COUNT=0
          TOTAL=4

          [ "$L1_GATES" = "success" ] && PASS_COUNT=$((PASS_COUNT + 1))
          [ "$L1_TTRL" = "success" ] && PASS_COUNT=$((PASS_COUNT + 1))
          [ "$L2_PYTHON" = "success" ] && PASS_COUNT=$((PASS_COUNT + 1))
          [ "$COHERENCE" = "success" ] && PASS_COUNT=$((PASS_COUNT + 1))

          SCORE=$(echo "scale=2; $PASS_COUNT / $TOTAL" | bc)
          echo "Constitutional Compliance: ${PASS_COUNT}/${TOTAL} (${SCORE})"
          echo ""

          if [ "$PASS_COUNT" -eq "$TOTAL" ]; then
            echo "::notice::CANONICAL STATUS: ACHIEVED"
            echo "[ENFORCEMENT: PROVEN] — All layers pass constitutional validation"
            echo ""
            echo "بذرة — Every seed carries within it the blueprint of an entire forest."
          elif [ "$PASS_COUNT" -ge 3 ]; then
            echo "::warning::CANONICAL STATUS: NEAR (${PASS_COUNT}/${TOTAL})"
            echo "[ENFORCEMENT: WIRED] — Most layers pass, remediation needed"
          else
            echo "::error::CANONICAL STATUS: NOT ACHIEVED (${PASS_COUNT}/${TOTAL})"
            echo "[OPTIMIZATION: PARTIAL] — Constitutional gaps remain"
            exit 1
          fi
