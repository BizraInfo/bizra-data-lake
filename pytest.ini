[pytest]
# BIZRA Test Configuration
# ========================

# Async test support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test paths
testpaths = tests

# Markers
markers =
    asyncio: async tests
    slow: slow tests (skip with -m "not slow")
    integration: integration tests requiring services
    tls: TLS tests requiring BIZRA_TLS_TESTS=1

# Output
addopts = -v --tb=short

# Warnings
filterwarnings =
    ignore::DeprecationWarning:datetime
