# PAT Enforcement Constitution v1
# ================================
# Peak Autonomous Agentic Think Tank - Maximum Enforcement
# Extends ihsan_v1.yaml with stricter SNR and cross-domain requirements

version: 1
id: pat_enforcement_v1
status: canonical
extends: ihsan_v1  # Inherits 8 Ihsan dimensions

# Core PAT Thresholds
thresholds:
  snr_minimum: 0.98      # 99.8% signal-to-noise ratio
  novelty_minimum: 0.75  # Semantic distance from known patterns
  ihsan_minimum: 0.95    # Inherited from ihsan_v1.yaml

# Cross-Pollination Requirements
cross_pollination:
  min_domains: 3                    # Minimum unrelated domains required
  unrelatedness_threshold: 0.70     # Cluster distance threshold
  min_cross_connections: 2          # Minimum connections between domains

# Elite Practitioner Requirements
practitioners:
  min_per_domain: 3          # Minimum practitioners per domain
  tier_required: top_1%      # Only top 1% practitioners
  relevance_threshold: 0.60  # Minimum relevance score to query

# Claim Tags with SNR Weights
claim_tags:
  MEASURED:
    weight: 1.00
    description: "Empirically verified data with citations"
    requires: ["citation", "methodology"]
  IMPLEMENTED:
    weight: 0.95
    description: "Code exists and has passed tests"
    requires: ["code_path", "test_evidence"]
  DERIVED:
    weight: 0.90
    description: "Logically derived from verified facts"
    requires: ["source_claims"]
  DESIGNED:
    weight: 0.75
    description: "Specification only, not yet implemented"
    requires: ["design_doc"]
  TARGET:
    weight: 0.50
    description: "Aspiration or goal, not yet achieved"
    requires: []
  HYPOTHESIS:
    weight: 0.40
    description: "Requires testing to validate"
    requires: ["test_plan"]
  METAPHOR:
    weight: 0.00
    description: "Figurative language only, no factual weight"
    requires: []
  NOVEL:
    weight: 1.00
    description: "PAT-specific: Novel insight with semantic distance >= 0.75"
    requires: ["novelty_score"]
  CROSS_DOMAIN:
    weight: 0.95
    description: "PAT-specific: Multi-domain synthesis point"
    requires: ["source_domains", "connection_type"]

# 5 Validation Gates
validation_gates:
  gate_1_pre_reasoning:
    name: "Domain Analysis Gate"
    position: "pre-reasoning"
    checks:
      - domain_count >= 3
      - unrelatedness_score >= 0.70
    correction: "expand_domains"
    fail_action: "block"

  gate_2_mid_synthesis:
    name: "Quality Checkpoint Gate"
    position: "mid-synthesis"
    checks:
      - running_snr >= 0.95
      - no_contradictions
      - claim_tags_present
    correction: "prune_low_quality_nodes"
    fail_action: "retry_synthesis"

  gate_3_post_synthesis:
    name: "Final Validation Gate"
    position: "post-synthesis"
    checks:
      - final_snr >= 0.98
      - novelty_score >= 0.75
      - domain_coverage_complete
    correction: "additional_synthesis_pass"
    fail_action: "block"

  gate_4_practitioner_verification:
    name: "Practitioner Anchor Gate"
    position: "pre-formatting"
    checks:
      - practitioners_per_domain >= 3
      - all_practitioners_tier_top_1%
      - relevance_scores_valid
    correction: "fetch_additional_practitioners"
    fail_action: "warn"

  gate_5_response_structure:
    name: "Response Format Gate"
    position: "pre-delivery"
    checks:
      - section_count == 6
      - all_claims_tagged
      - evidence_trail_complete
    correction: "reformat_response"
    fail_action: "block"

# 6-Section Response Structure
response_structure:
  sections:
    - id: executive_synthesis
      name: "Executive Synthesis"
      max_bullets: 5
      requirements:
        - claim_tagged
        - evidence_linked
      format: "bullet_list"

    - id: domain_cross_pollination_map
      name: "Domain Cross-Pollination Map"
      requirements:
        - domains_listed
        - connections_mapped
        - synthesis_points_identified
      format: "structured_map"

    - id: elite_practitioner_anchoring
      name: "Elite Practitioner Anchoring"
      requirements:
        - min_3_per_domain
        - tier_verified
        - relevance_scored
      format: "practitioner_table"

    - id: novel_insight_synthesis
      name: "Novel Insight Synthesis"
      requirements:
        - novelty_score >= 0.75
        - semantic_distance_verified
        - source_patterns_cited
      format: "narrative"

    - id: validation_evidence_trail
      name: "Validation Evidence Trail"
      requirements:
        - gate_statuses
        - snr_scores
        - ihsan_scores
        - receipt_ids
      format: "evidence_table"

    - id: actionable_recommendations
      name: "Actionable Recommendations"
      requirements:
        - what_we_know
        - what_we_assume
        - what_we_test_next
      format: "categorized_list"

# Real-Time Correction Protocols
correction_protocols:
  expand_domains:
    trigger: "domain_count < 3"
    action: "query_adjacent_clusters"
    max_retries: 3

  prune_low_quality_nodes:
    trigger: "running_snr < 0.95"
    action: "remove_nodes_below_snr_0.85"
    preserve: "highest_snr_per_lens"

  additional_synthesis_pass:
    trigger: "final_snr < 0.98 or novelty < 0.75"
    action: "synthesize_new_cross_domain_insight"
    max_retries: 2

  fetch_additional_practitioners:
    trigger: "practitioners_per_domain < 3"
    action: "query_practitioner_registry"
    fallback: "use_top_available"

  reformat_response:
    trigger: "section_count != 6 or missing_tags"
    action: "apply_template_strict"
    validate_after: true

# Receipt Integration
receipt_schema:
  fields:
    - pat_session_id
    - timestamp
    - gate_results
    - snr_score
    - novelty_score
    - domain_count
    - practitioner_count
    - claim_tag_distribution
    - correction_attempts
  emit_to: "docs/evidence/receipts/pat/"

# SAPE Integration
sape_integration:
  novelty_probe:
    type: "NOVELTY"
    weight: 0.12
    threshold: 0.75
  elevation_priority:
    cross_domain_patterns: 1.5  # 50% priority boost
    novel_insights: 1.3         # 30% priority boost

# SNR Tracker Integration
snr_integration:
  tier_name: "PAT"
  target_snr: 0.98
  minimum_snr: 0.95
  escalate_below: 0.90

# Invariants
invariants:
  snr_threshold_enforced: true
  novelty_threshold_enforced: true
  cross_pollination_enforced: true
  practitioner_verification_enforced: true
  response_structure_enforced: true
  claim_tagging_required: true
  receipt_generation_required: true

provenance:
  source:
    - constitution/ihsan_v1.yaml
    - user_specification/pat_peak_mode.yaml
  created: "2026-01-24"
  note: >
    PAT Enforcement extends Ihsan with stricter SNR (0.98), cross-domain
    requirements, and structured response formatting. All Ihsan thresholds
    remain in effect.
