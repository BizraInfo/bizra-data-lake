[package]
name = "bizra-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Sovereign Agent Runtime — the being that uses hooks (nerves) and memory (brain). Orchestrates PAT (Personal Agent Team) with 7 specialized agents per user."
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
bizra-hooks    = { path = "../bizra-hooks"    }
bizra-memory   = { path = "../bizra-memory"   }
bizra-telescript = { path = "../bizra-telescript" }
bizra-action   = { path = "../bizra-action"   }
bizra-ttrl     = { path = "../bizra-ttrl"     }
blake3      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
ffi = []  # Enable C-ABI exports for desktop bridge
