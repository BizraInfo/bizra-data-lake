program:
  id: elite_fullstack_masterpiece
  name: "BIZRA Elite Full-Stack Blueprint"
  version: "3.0.0"
  intent: >
    Enforce a professional, evidence-backed implementation baseline across PMBOK,
    DevOps, CI/CD, architecture, security, performance, documentation, and
    ethical governance.
  giants_protocol:
    - "Shannon:SNR maximization"
    - "Besta:graph-of-thought reasoning topology"
    - "Deming:PDCA quality discipline"
    - "Boyd:OODA bounded execution loops"
    - "Lamport:deterministic evidence ordering"
    - "PMBOK:lifecycle governance"
    - "SAPE:symbolic-abstraction-probe-elevation"
    - "Al-Ghazali:Ihsan as hard floor"

pmbok_domains:
  - initiating
  - planning
  - executing
  - monitoring_controlling
  - closing

checks:
  files:
    workflows:
      - ".github/workflows/ci.yml"
      - ".github/workflows/phase65-masterpiece.yml"
      - ".github/workflows/phase56-security-gate.yml"
    scripts:
      - "scripts/ops/phase65_masterpiece_runner.py"
      - "scripts/ops/phase65_blueprint_gate.py"
      - "scripts/ops/phase65_kpi_pack.py"
      - "scripts/ops/phase65_alpha_launch_packet.py"
      - "scripts/ops/autonomous_engine_gate.py"
      - "config/autonomous_engine_gate.yaml"
    docs:
      - "docs/specs/phase_65_lifecycle_protocol/phase_65_09_masterpiece_blueprint.md"
      - "ROADMAP.md"
      - "COMMUNITY.md"
      - "COMMIT_STYLE_GUIDE.md"
      - "DISCORD_CI_SETUP.md"
      - "README_BADGES_UPDATE.md"
  jobs:
    ".github/workflows/ci.yml":
      - "phase65-masterpiece-gate"
      - "phase56-security-gate"
      - "security-scan"
      - "evidence-accumulate"
    ".github/workflows/phase65-masterpiece.yml":
      - "phase65-gate"
  readme:
    required_patterns:
      - "[![CI Status]"
      - "[![Discord]"
      - "[![Roadmap]"
      - "[Public Roadmap](ROADMAP.md)"
      - "[Community Guide](COMMUNITY.md)"
      - "## Community"
  phase65_thresholds:
    min_snr_score: 0.90
    min_avg_ihsan: 0.75
    min_speedup_system1_vs_system2: 8.0
    max_avg_latency_ms: 2200.0
    signed_receipts_required: true
  pmbok_artifacts:
    initiating:
      - "docs/ELITE_FULLSTACK_BLUEPRINT.md"
      - "docs/internal/UNIFIED_ACTIONABLE_FRAMEWORK.md"
      - "config/elite_fullstack_blueprint.yaml"
    planning:
      - "config/phase65_masterpiece_roadmap.yaml"
      - "docs/specs/phase_65_lifecycle_protocol/phase_65_09_masterpiece_blueprint.md"
    executing:
      - "scripts/ops/phase65_masterpiece_runner.py"
      - ".github/workflows/ci.yml"
    monitoring_controlling:
      - "scripts/ops/elite_fullstack_blueprint_audit.py"
      - "scripts/ci_quality_gate.py"
    closing:
      - "scripts/ops/phase65_alpha_launch_packet.py"
      - "scripts/evidence/release_pack.py"
  pipeline_automation:
    workflows:
      - ".github/workflows/ci.yml"
      - ".github/workflows/phase65-masterpiece.yml"
    required_job_dependencies:
      ".github/workflows/ci.yml":
        job: "ci-summary"
        needs_all_of:
          - "quality-gates"
          - "phase65-masterpiece-gate"
          - "evidence-accumulate"
    required_patterns:
      ".github/workflows/ci.yml":
        - "evidence-accumulate"
        - "phase65-masterpiece-gate"
        - "phase56-security-gate"
        - "autonomous_engine_report.json"
        - "autonomous_gate_passed"
  docs_truth:
    required_files:
      - "scripts/ci_docs_truth_gate.py"
      - "tests/scripts/test_ci_docs_truth_gate.py"
      - "docs/internal/UNIFIED_ACTIONABLE_FRAMEWORK.md"
      - "docs/internal/DOCS_INDEX.md"
    required_patterns:
      ".github/workflows/ci.yml":
        - "python scripts/ci_docs_truth_gate.py"
      ".github/workflows/docs-quality.yml":
        - "python scripts/ci_docs_truth_gate.py"
      "docs/internal/DOCS_INDEX.md":
        - "UNIFIED_ACTIONABLE_FRAMEWORK.md"
  architecture_coherence:
    required_files:
      - "core/sovereign/api.py"
      - "core/sovereign/terminal.py"
      - "core/proof_engine/receipt.py"
      - "core/reasoning/verified_graph.py"
      - "docs/internal/UNIFIED_ACTIONABLE_FRAMEWORK.md"
      - "frontend/src/components/terminal/terminal-manifest.ts"
    required_patterns:
      "core/sovereign/api.py":
        - "/v1/plan"
        - "/v1/stream"
        - "/v1/settings/model-routing"
      "core/sovereign/terminal.py":
        - "BLOCKED_CONSTITUTIONALLY"
        - "SYSTEM_1_CACHE_HIT"
        - "AWAITING_ESCALATION"
      "docs/internal/UNIFIED_ACTIONABLE_FRAMEWORK.md":
        - "Strategic Workstreams"
        - "Prioritized Roadmap"
        - "SAPE Execution Method"
  security_coherence:
    required_files:
      - "docs/security/hardening-checklist.md"
      - "core/auth/middleware.py"
      - "scripts/ci_secret_scan.py"
      - ".github/workflows/ci.yml"
      - "core/sovereign/api.py"
    required_patterns:
      ".github/workflows/ci.yml":
        - "scripts/ci_secret_scan.py"
      "core/sovereign/api.py":
        - "auth.boundary.crossed"
        - "receipt.verified"
        - "tick.completed"
  terminal_contract:
    required_files:
      - "docs/specs/phase_78_terminal_v1/BIZRA-Terminal-v1-Locked-Build-Contract.md"
      - "frontend/src/components/terminal/terminal-manifest.ts"
      - "frontend/src/components/terminal/terminal-shell.tsx"
      - "frontend/src/components/terminal/terminal-mission.tsx"
      - "frontend/src/components/terminal/terminal-timeline.tsx"
      - "frontend/src/components/terminal/terminal-memory.tsx"
      - "frontend/src/components/terminal/terminal-skills.tsx"
      - "frontend/src/components/terminal/terminal-network.tsx"
      - "frontend/src/components/terminal/terminal-settings.tsx"
      - "frontend/tests/terminal-panels.test.tsx"
    required_patterns:
      "frontend/src/components/terminal/terminal-shell.tsx":
        - "terminal-manifest"
        - "One mission, one proof, remembered forever"
      "frontend/src/components/terminal/terminal-skills.tsx":
        - "PAT_AGENT_MANIFEST"
        - "SAT_AGENT_MANIFEST"
  performance_controls:
    required_files:
      - ".github/workflows/performance.yml"
      - "scripts/ci_release_readiness.py"
      - "scripts/ci_quality_gate.py"
      - "scripts/quality_spine.py"
      - "tests/scripts/test_quality_spine.py"
    required_jobs:
      ".github/workflows/ci.yml":
        - "performance-gate"
      ".github/workflows/performance.yml":
        - "performance-gate"
    required_patterns:
      ".github/workflows/ci.yml":
        - "needs.performance-gate.result"
        - "Gate 12: Performance Gate"
  qa:
    required_test_targets:
      - "tests/scripts/test_phase65_blueprint_gate.py"
      - "tests/scripts/test_phase65_masterpiece_runner.py"
      - "tests/scripts/test_elite_fullstack_blueprint_audit.py"
      - "tests/scripts/test_autonomous_engine_gate.py"
      - "tests/scripts/test_self_rlvr_harness.py"
    required_quality_scripts:
      - "scripts/ci_quality_gate.py"
      - "scripts/ci_docs_quality.py"
    min_test_files: 200
  ethical_integrity:
    source_file: "core/integration/constants.py"
    required_invariants:
      - "RIBA_ZERO"
      - "CLAIM_MUST_BIND"
      - "IHSAN_FLOOR"

scoring:
  min_score: 0.93
  weights:
    files: 0.12
    jobs: 0.09
    readme: 0.03
    thresholds: 0.15
    pmbok: 0.07
    pipeline: 0.09
    qa: 0.09
    ethics: 0.04
    docs_truth: 0.08
    architecture: 0.05
    security: 0.05
    terminal: 0.07
    performance: 0.07
