name: Membrane Tax Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'scripts/ci_membrane_tax_benchmark.py'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'scripts/ci_membrane_tax_benchmark.py'

jobs:
  membrane-tax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --break-system-packages 2>/dev/null || pip install -r requirements.txt

      - name: Run membrane tax benchmark
        run: |
          python scripts/ci_membrane_tax_benchmark.py --ci-mode --output benchmark_results.json

      - name: Gate — fail on clamped negative metrics
        run: |
          python -c "
          import json, sys
          with open('benchmark_results.json') as f:
              results = json.load(f)
          sanity = results.get('benchmark_sanity', {})
          clamped = sanity.get('clamped_negative_metrics', [])
          if clamped:
              print('MEMBRANE TAX GATE FAILED')
              print(f'Clamped negative metrics: {clamped}')
              print('These indicate measurement seams that must be fixed.')
              sys.exit(1)
          print('MEMBRANE TAX GATE PASSED')
          print(f'All metrics clean. Sanity checks: {sanity}')
          "

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: membrane-tax-results
          path: benchmark_results.json
          retention-days: 30
