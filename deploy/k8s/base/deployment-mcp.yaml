# BIZRA MCP Service Mesh — Kubernetes Deployment
# Model Context Protocol servers for the Sovereign Organism
#
# Standing on Giants: Kubernetes, MCP (Anthropic), Lamport (distributed ordering)
# Constitutional Constraint: Ihsan >= 0.95
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizra-mcp-gateway
  namespace: bizra
  labels:
    app: bizra-mcp
    app.kubernetes.io/name: bizra
    app.kubernetes.io/component: mcp-gateway
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bizra-mcp
      component: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bizra-mcp
        component: gateway
        app.kubernetes.io/name: bizra
        app.kubernetes.io/component: mcp-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: bizra-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-gateway
          image: bizra-mcp:RELEASE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MCP_SERVER
              value: "gateway"
            - name: MCP_HTTP_PORT
              value: "8080"
            - name: REDIS_URL
              value: "redis://bizra-redis:6379"
            - name: BIZRA_MCP_ALLOW_ANONYMOUS
              value: "false"
            # Cluster clients are non-loopback; require token and allow remote.
            - name: BIZRA_MCP_ALLOW_REMOTE
              value: "true"
            - name: BIZRA_MCP_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bizra-secrets
                  key: mcp-gateway-token
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - configMapRef:
                name: bizra-config
            - configMapRef:
                name: bizra-mcp-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - gateway
                topologyKey: kubernetes.io/hostname
