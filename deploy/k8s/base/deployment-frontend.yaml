# BIZRA Frontend (DDAGI OS) Deployment
# Static SPA served via Nginx with API reverse proxy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bizra-frontend
  namespace: bizra
  labels:
    app: bizra-frontend
    app.kubernetes.io/name: bizra
    app.kubernetes.io/component: frontend
    app.kubernetes.io/version: "0.3.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bizra-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bizra-frontend
        app.kubernetes.io/name: bizra
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: bizra-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 101    # nginx user in Alpine
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: bizra-frontend:RELEASE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: API_UPSTREAM
              value: "bizra-elite:80"
            - name: WS_UPSTREAM
              value: "bizra-elite:80"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Nginx needs writable cache/pid
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - bizra-frontend
                topologyKey: kubernetes.io/hostname
