[package]
name = "iceoryx-bridge"
version = "2.2.0"
edition = "2021"
description = "Zero-copy IPC bridge for BIZRA Sovereign LLM using Iceoryx2"
license = "MIT"
authors = ["BIZRA Collective"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Iceoryx2 for zero-copy IPC (250ns latency target)
iceoryx2 = { workspace = true }

# Node-API bindings
napi = { workspace = true }
napi-derive = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Shared memory utilities
memmap2 = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[build-dependencies]
napi-build = "2.1"

[[bench]]
name = "ipc_latency"
harness = false
