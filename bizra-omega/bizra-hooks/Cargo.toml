[package]
name = "bizra-hooks"
version = "0.1.0"
edition = "2021"
description = "BIZRA Hook System — The sovereign nervous system. Zero dependencies. Pure Rust."
license = "MIT"
authors = ["BIZRA Collective"]
readme = "README.md"

# RSI Pillar I:  Complete Self-Modeling via Component Registry
# RSI Pillar IV: Safe Deployment via Hook Chain gating
# RSI Pillar V:  Stable Iteration via إحسان Lyapunov certificates

[lib]
name = "bizra_hooks"
crate-type = ["rlib", "staticlib"]
# rlib:      Other Rust crates in workspace consume directly
# staticlib: C-ABI for FFI bridge to Python/Node/WASM

[features]
default = []
ffi = []         # Enable C-ABI exports
std = []         # Enable std-dependent features (default: no_std compatible core)

# ZERO [dependencies]. This is deliberate.
# The nervous system depends on nothing. Everything depends on it.
# External integration happens through FFI boundary, not dependency coupling.
