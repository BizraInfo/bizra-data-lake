resource_policy:
  # Hard bounds — prevent accidental VRAM eviction/fragmentation and keep-alive surprises.
  ollama:
    max_loaded_models: 1
    keep_alive: "10m"         # set OLLAMA_KEEP_ALIVE=10m (or shorter for VRAM pressure)
    num_parallel: 1
    request_timeout_s: 15
  gpu:
    enforce_vram_soft_cap_mb: 14000   # for 16GB cards; tune per GPU
    fail_open_cpu: true              # sovereignty over performance

governance:
  # Evidence sealing policy. Replace placeholder signer ids with real validator keys.
