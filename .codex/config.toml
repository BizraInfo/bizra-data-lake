# High-capability project-local Codex configuration for BIZRA-DATA-LAKE.
# This file is repo-scoped and is merged with ~/.codex/config.toml.
# Linux note: workspace-write sandbox uses bubblewrap (bwrap), which needs
# user namespaces. If Codex fails with "Operation not permitted" in bwrap, run:
#   ./scripts/ops/codex_linux_userns_preflight.sh --apply
# If probe still fails in nested/containerized runtimes, use danger-full-access
# only for trusted repos.

profile = "peak_capability"
project_root_markers = [".git", "AGENTS.md", ".codex"]
project_doc_max_bytes = 131072
suppress_unstable_features_warning = true

[history]
persistence = "save-all"
max_bytes = 104857600

[tools]
view_image = true

[features]
memories = true
undo = true

[memories]
use_memories = true
generate_memories = true
no_memories_if_mcp_or_web_search = false
max_rollouts_per_startup = 32
max_raw_memories_for_consolidation = 512

[agents]
max_threads = 8
max_depth = 2
job_max_runtime_seconds = 3600

[profiles.peak_capability]
model = "gpt-5.3-codex"
review_model = "gpt-5.3-codex"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
model_reasoning_summary = "auto"
model_verbosity = "high"
personality = "pragmatic"
service_tier = "fast"

[profiles.fast_iteration]
model = "gpt-5.4"
review_model = "gpt-5.3-codex"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "auto"
model_verbosity = "medium"
personality = "pragmatic"
service_tier = "fast"

[profiles.safe_readonly]
model = "gpt-5.3-codex"
review_model = "gpt-5.3-codex"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "medium"
model_reasoning_summary = "auto"
model_verbosity = "medium"
personality = "pragmatic"
service_tier = "fast"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.filesystem]
command = "npx"
args = [
  "-y",
  "@modelcontextprotocol/server-filesystem@latest",
  "/data/bizra/repos/bizra-data-lake",
]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory@latest"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.memory.tools.search_nodes]
approval_mode = "approve"

[mcp_servers."sequential-thinking"]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking@latest"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.github]
command = "bash"
args = [
  "-lc",
  "export GITHUB_PERSONAL_ACCESS_TOKEN=\"${GITHUB_TOKEN:-}\"; exec npx -y @modelcontextprotocol/server-github@latest",
]
env_vars = ["GITHUB_TOKEN"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers."brave-search"]
# Optional: requires BRAVE_API_KEY. Keep disabled by default so Codex startup
# does not report MCP startup incomplete on machines without the secret.
# Enable per run with:
#   codex -c 'mcp_servers.brave-search.enabled=true'
enabled = false
command = "npx"
args = ["-y", "@modelcontextprotocol/server-brave-search@latest"]
env_vars = ["BRAVE_API_KEY"]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.sqlite]
command = "bash"
args = [
  "-lc",
  "repo=$(git rev-parse --show-toplevel 2>/dev/null || pwd); cd \"$repo\" && exec \"$repo/.venv/bin/python\" \"$repo/tools/mcp/sqlite_mcp_server.py\" --db-path \"$repo/sovereign_state/living_memory/memory.db\" --server-name bizra-sqlite",
]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers."claude-flow-sqlite"]
command = "bash"
args = [
  "-lc",
  "repo=$(git rev-parse --show-toplevel 2>/dev/null || pwd); cd \"$repo\" && exec \"$repo/.venv/bin/python\" \"$repo/tools/mcp/sqlite_mcp_server.py\" --db-path \"$repo/.swarm/memory.db\" --server-name claude-flow-sqlite",
]
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers."bizra-sovereign"]
command = "bash"
args = [
  "-lc",
  "repo=$(git rev-parse --show-toplevel 2>/dev/null || pwd); cd \"$repo\" && exec \"$repo/.venv/bin/python\" \"$repo/tools/mcp/sovereign_mcp_server.py\" --stdio",
]
cwd = "/data/bizra/repos/bizra-data-lake"
env_vars = [
  "BRAVE_API_KEY",
  "GOOGLE_API_KEY",
  "LANGEXTRACT_API_KEY",
  "LM_STUDIO_API_KEY",
  "LM_API_TOKEN",
]
startup_timeout_sec = 30
tool_timeout_sec = 180

[mcp_servers."bizra-ecosystem"]
command = "bash"
args = [
  "-lc",
  "repo=$(git rev-parse --show-toplevel 2>/dev/null || pwd); cd \"$repo\" && exec \"$repo/.venv/bin/python\" \"$repo/tools/mcp/ecosystem_mcp_server.py\" --stdio",
]
cwd = "/data/bizra/repos/bizra-data-lake"
env_vars = [
  "BRAVE_API_KEY",
  "GOOGLE_API_KEY",
  "LANGEXTRACT_API_KEY",
  "LM_STUDIO_API_KEY",
  "LM_API_TOKEN",
]
startup_timeout_sec = 30
tool_timeout_sec = 180
