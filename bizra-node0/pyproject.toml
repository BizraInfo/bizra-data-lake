[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bizra-node0"
version = "0.1.0"
description = "BIZRA Genesis Node0 — Sovereign Lifecycle Runtime"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "MoMo", email = "momo@bizra.info"},
]

dependencies = [
    "pyyaml>=6.0",
    "ed25519>=1.5",
    "pynacl>=1.5.0",
    "blake3>=0.4.0",
    "cryptography>=41.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
bizra-node0 = "scripts.node0_standalone:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402"]

[tool.black]
line-length = 120
target-version = ["py311"]
