[package]
name = "bizra-cognition"
version = "0.1.0"
edition = "2021"
description = "BIZRA cognition substrate — dual-rate thought graph, receipted myelination, and replay-from-chain runtime"

[dependencies]
blake3 = { version = "1.5", features = ["rayon"] }
sled = { version = "0.34", optional = true }

# Cycle-6 G1 — durable-read bridge over Python-authored sovereign_state/.
# serde_json::Map defaults to BTreeMap (keys auto-sorted), matching Python
# json.dumps(..., sort_keys=True). Custom Formatter reproduces default
# separators (", " and ": " with spaces) for byte-parity with the writer.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
sled-store = ["sled"]
