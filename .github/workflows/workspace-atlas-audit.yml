name: Workspace Atlas Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  atlas-audit:
    name: Full Workspace Atlas
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build inventory manifests
        run: |
          mkdir -p artifacts/inventory
          find . -mindepth 1 -type d -print0 | sort -z | tr '\0' '\n' > artifacts/inventory/dirs_all.txt
          find . -mindepth 1 -type f -print0 | sort -z | tr '\0' '\n' > artifacts/inventory/files_all.txt

      - name: Run workspace masterpiece engine
        run: |
          python scripts/atlas/workspace_masterpiece_engine.py \
            --files-manifest artifacts/inventory/files_all.txt \
            --dirs-manifest artifacts/inventory/dirs_all.txt \
            --out-json artifacts/atlas/workspace_masterpiece_report.json \
            --out-md artifacts/atlas/workspace_masterpiece_report.md \
            --top-n 25

      - name: Upload atlas artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-atlas-report
          path: |
            artifacts/inventory/dirs_all.txt
            artifacts/inventory/files_all.txt
            artifacts/atlas/workspace_masterpiece_report.json
            artifacts/atlas/workspace_masterpiece_report.md
          retention-days: 14
