name: Phase56 Security Gate

on:
  push:
    branches: [main, master, develop]
    paths:
      - "core/auth/middleware.py"
      - "core/benchmark/guardrails.py"
      - "core/federation/secure_transport.py"
      - "core/inference/rlm_bridge.py"
      - "core/sovereign/tiered_verification.py"
      - "core/zpk/**"
      - "filedfs/**"
      - "deploy/**"
      - "bizra-omega/bizra-api/**"
      - "bizra-omega/Cargo.toml"
      - "bizra-omega/Cargo.lock"
      - "pyproject.toml"
      - "scripts/phase56_security_gate.sh"
      - "tests/core/federation/test_secure_transport.py"
      - "tests/core/inference/test_rlm_sandbox.py"
      - "tests/core/zpk/test_zero_point_kernel.py"
      - "tests/core/auth/test_middleware_fail_closed.py"
      - "tests/core/benchmark/test_guardrails_whitespace.py"
      - "tests/core/sovereign/test_tiered_verification_whitespace.py"
      - "tests/integration/test_phase56_medium_hardening.py"
      - "tests/integration/test_phase56_bridge_hardening.py"
      - "tests/integration/test_phase56_infra_hardening.py"
      - ".github/workflows/phase56-security-gate.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "core/auth/middleware.py"
      - "core/benchmark/guardrails.py"
      - "core/federation/secure_transport.py"
      - "core/inference/rlm_bridge.py"
      - "core/sovereign/tiered_verification.py"
      - "core/zpk/**"
      - "filedfs/**"
      - "deploy/**"
      - "bizra-omega/bizra-api/**"
      - "bizra-omega/Cargo.toml"
      - "bizra-omega/Cargo.lock"
      - "pyproject.toml"
      - "scripts/phase56_security_gate.sh"
      - "tests/core/federation/test_secure_transport.py"
      - "tests/core/inference/test_rlm_sandbox.py"
      - "tests/core/zpk/test_zero_point_kernel.py"
      - "tests/core/auth/test_middleware_fail_closed.py"
      - "tests/core/benchmark/test_guardrails_whitespace.py"
      - "tests/core/sovereign/test_tiered_verification_whitespace.py"
      - "tests/integration/test_phase56_medium_hardening.py"
      - "tests/integration/test_phase56_bridge_hardening.py"
      - "tests/integration/test_phase56_infra_hardening.py"
      - ".github/workflows/phase56-security-gate.yml"
  workflow_dispatch:

concurrency:
  group: phase56-security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-hardening:
    name: Security Hardening Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bizra-omega/target
          key: ${{ runner.os }}-phase56-cargo-${{ hashFiles('bizra-omega/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-phase56-cargo-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run Phase56 security gate
        run: ./scripts/phase56_security_gate.sh
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload Phase56 engine report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase56-engine-report
          path: artifacts/phase56/
          retention-days: 14
