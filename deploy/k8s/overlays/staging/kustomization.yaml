apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: bizra-staging

labels:
  - pairs:
      environment: staging
    includeSelectors: false

images:
  - name: bizra-elite
    newName: ghcr.io/bizra/bizra-data-lake/elite
    newTag: elite-placeholder
  - name: bizra-omega
    newName: ghcr.io/bizra/bizra-data-lake/omega
    newTag: omega-placeholder
  - name: bizra-mcp
    newName: ghcr.io/bizra/bizra-data-lake/mcp
    newTag: mcp-placeholder
  - name: bizra-frontend
    newName: ghcr.io/bizra/bizra-data-lake/frontend
    newTag: frontend-placeholder

replicas:
  - name: bizra-elite
    count: 1
  - name: bizra-omega
    count: 1
  - name: bizra-mcp-gateway
    count: 1
  - name: bizra-mcp-sovereign
    count: 1
  - name: bizra-mcp-ecosystem
    count: 1
  - name: bizra-mcp-peak
    count: 1

patches:
  - path: patches/ingress.yaml
  - path: patches/internal-ingress.yaml
  - path: patches/mcp-config.yaml
  - path: patches/hpa-elite.yaml
  - path: patches/hpa-omega.yaml
  - path: patches/hpa-mcp-gateway.yaml
