# BIZRA Base Kustomization
# Common resources for all environments
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bizra

commonLabels:
  app.kubernetes.io/name: bizra
  app.kubernetes.io/part-of: bizra-ecosystem
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - rbac.yaml
  - storage.yaml
  - deployment-elite.yaml
  - deployment-omega.yaml
  - deployment-mcp.yaml
  - services.yaml
  - services-mcp.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml

images:
  # IMPORTANT: Override newTag at deploy time via:
  #   kustomize edit set image bizra-elite=ghcr.io/bizra/bizra-data-lake/elite:<sha>
  # Never deploy 'latest' to production — use immutable SHA-based tags.
  - name: bizra-elite
    newName: ghcr.io/bizra/bizra-data-lake/elite
    newTag: "${GIT_SHA:-v1.0.0}"
  - name: bizra-omega
    newName: ghcr.io/bizra/bizra-data-lake/omega
    newTag: "${GIT_SHA:-v1.0.0}"
  - name: bizra-mcp
    newName: ghcr.io/bizra/bizra-data-lake/mcp
    newTag: "${GIT_SHA:-v1.0.0}"

configMapGenerator:
  - name: bizra-version
    literals:
      - version=1.0.0
      - commit=${GIT_COMMIT:-unknown}
      - build_date=${BUILD_DATE:-unknown}
