apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - monitoring.yaml

namespace: bizra

labels:
  - pairs:
      environment: production
    includeSelectors: false

commonAnnotations:
  bizra.io/quality-gate: "constitutional"
  bizra.io/ihsan-threshold: "0.95"

images:
  - name: bizra-elite
    newName: ghcr.io/bizra/bizra-data-lake/elite
    newTag: elite-placeholder
  - name: bizra-omega
    newName: ghcr.io/bizra/bizra-data-lake/omega
    newTag: omega-placeholder
  - name: bizra-mcp
    newName: ghcr.io/bizra/bizra-data-lake/mcp
    newTag: mcp-placeholder

patches:
  - target:
      kind: Deployment
      name: bizra-elite
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2000m
  - target:
      kind: HorizontalPodAutoscaler
      name: bizra-elite-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 15
  - target:
      kind: HorizontalPodAutoscaler
      name: bizra-omega-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
