name: Autopoietic Cycle Verification

on:
  push:
    paths:
      - 'cycle-*/**'
      - 'core/proof_engine/**'
      - 'core/sat/**'
      - 'core/adk/**'
  pull_request:
    paths:
      - 'cycle-*/**'

jobs:
  verify-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e . pytest

      - name: Run Cycle 1 re-verification
        run: |
          python cycle-1/reverify.py
        env:
          BIZRA_DATA_LAKE_ROOT: ${{ github.workspace }}

      - name: Report hash
        if: always()
        run: |
          # Log the computed hash for audit trail (reverify.py already validates 12/12)
          python cycle-1/reverify.py 2>&1 | grep "BLAKE3:\|BLAKE2B:\|Checks:" || true
