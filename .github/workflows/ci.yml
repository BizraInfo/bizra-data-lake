  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 3a: Phase 65 Masterpiece Lifecycle Gate
  # ═══════════════════════════════════════════════════════════════════════════
  phase65-masterpiece-gate:
    name: Phase65 Masterpiece Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [quality-gates, quality-gate-bypass-audit]
    if: ${{ needs.quality-gates.result == 'success' || needs.quality-gate-bypass-audit.result == 'success' }}
    outputs:
      gate_passed: ${{ steps.phase65_outputs.outputs.gate_passed }}
      snr_score: ${{ steps.phase65_outputs.outputs.snr_score }}
      avg_ihsan: ${{ steps.phase65_outputs.outputs.avg_ihsan }}
      avg_latency_ms: ${{ steps.phase65_outputs.outputs.avg_latency_ms }}
      speedup: ${{ steps.phase65_outputs.outputs.speedup }}
      signed_receipts: ${{ steps.phase65_outputs.outputs.signed_receipts }}
      tier: ${{ steps.phase65_outputs.outputs.tier }}
      launch_decision: ${{ steps.phase65_outputs.outputs.launch_decision }}
      launch_ready: ${{ steps.phase65_outputs.outputs.launch_ready }}
      packet_signed: ${{ steps.phase65_outputs.outputs.packet_signed }}
      blueprint_gate_passed: ${{ steps.blueprint_outputs.outputs.blueprint_gate_passed }}
      blueprint_score: ${{ steps.blueprint_outputs.outputs.blueprint_score }}
      blueprint_weights_total: ${{ steps.blueprint_outputs.outputs.blueprint_weights_total }}
      blueprint_failed_checks: ${{ steps.blueprint_outputs.outputs.blueprint_failed_checks }}
      autonomous_gate_passed: ${{ steps.autonomous_outputs.outputs.autonomous_gate_passed }}
      autonomous_score: ${{ steps.autonomous_outputs.outputs.autonomous_score }}
      autonomous_prompt_snr: ${{ steps.autonomous_outputs.outputs.autonomous_prompt_snr }}
      autonomous_rlvr_snr: ${{ steps.autonomous_outputs.outputs.autonomous_rlvr_snr }}
      autonomous_qualified_rate: ${{ steps.autonomous_outputs.outputs.autonomous_qualified_rate }}
      autonomous_compiled: ${{ steps.autonomous_outputs.outputs.autonomous_compiled }}
      autonomous_chain_valid: ${{ steps.autonomous_outputs.outputs.autonomous_chain_valid }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyyaml

      - name: Resolve signer policy
        shell: bash
        env:
          BRANCH_SIGNER_KEY: ${{ secrets.BIZRA_RECEIPT_PRIVATE_KEY_HEX }}
        run: |
          protected=false
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/master" ]]; then
            protected=true
          fi
          key="${BRANCH_SIGNER_KEY:-}"
          if [[ -z "$key" && "$protected" == "true" ]]; then
            echo "::error::BIZRA_RECEIPT_PRIVATE_KEY_HEX secret is required on protected branches."
            exit 1
          fi
          if [[ -z "$key" ]]; then
            key="1111111111111111111111111111111111111111111111111111111111111111"
            echo "::notice::Using deterministic fallback signing key for non-protected branch."
          fi
          echo "BIZRA_RECEIPT_PRIVATE_KEY_HEX=$key" >> "$GITHUB_ENV"

      - name: Run Phase65 masterpiece pipeline
        id: phase65_outputs
        run: |
          mkdir -p /tmp/phase65
          rm -rf /tmp/phase65/state
          python scripts/ops/phase65_masterpiece_runner.py \
            --state-dir /tmp/phase65/state \
            --out-dir /tmp/phase65 \
            --config config/phase65_masterpiece_roadmap.yaml \
            --strict-signing \
            --github-output "$GITHUB_OUTPUT"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run Phase65 targeted tests
        run: |
          pytest -q \
            tests/scripts/test_node0_lifecycle_emulation.py \
            tests/scripts/test_phase65_blueprint_gate.py \
            tests/scripts/test_phase65_kpi_pack.py \
            tests/scripts/test_phase65_alpha_launch_packet.py \
            tests/scripts/test_phase65_masterpiece_runner.py \
            tests/scripts/test_elite_fullstack_blueprint_audit.py \
            tests/core/elite/test_self_harness_engine.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run elite full-stack blueprint audit
        run: |
          python scripts/ops/elite_fullstack_blueprint_audit.py \
            --config config/elite_fullstack_blueprint.yaml \
            --report /tmp/phase65/elite_fullstack_blueprint_report.json
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Extract elite blueprint outputs
        id: blueprint_outputs
        run: |
          python - <<'PY'
          import os
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/phase65/elite_fullstack_blueprint_report.json").read_text(encoding="utf-8")
          )
          out_path = Path(os.environ["GITHUB_OUTPUT"])
          with out_path.open("a", encoding="utf-8") as fh:
              fh.write(f"blueprint_gate_passed={str(report.get('gate_passed', False)).lower()}\n")
              fh.write(f"blueprint_score={report.get('weighted_score', 0.0)}\n")
              fh.write(f"blueprint_weights_total={report.get('weights_total', 0.0)}\n")
              fh.write(f"blueprint_failed_checks={len(report.get('failed_checks') or [])}\n")
          PY

      - name: Run autonomous SNR/GoT engine gate
        id: autonomous_outputs
        run: |
          python scripts/ops/autonomous_engine_gate.py \
            --config config/autonomous_engine_gate.yaml \
            --report /tmp/phase65/autonomous_engine_report.json \
            --github-output "$GITHUB_OUTPUT"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run self-harness quality scan
        run: |
          python scripts/self_harness_run.py \
            --force \
            --output /tmp/phase65/self_harness_report.json
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload Phase65 artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: phase65-masterpiece-artifacts
          path: |
            /tmp/phase65/lifecycle_summary.json
            /tmp/phase65/phase65_gate_report.json
            /tmp/phase65/phase65_kpi_snapshot.json
            /tmp/phase65/phase65_kpi_snapshot.md
            /tmp/phase65/phase65_alpha_launch_packet.json
            /tmp/phase65/phase65_alpha_launch_packet.md
            /tmp/phase65/elite_fullstack_blueprint_report.json
            /tmp/phase65/autonomous_engine_report.json
            /tmp/phase65/self_harness_report.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 3b: Phase 56 Security Hardening Gate
  # ═══════════════════════════════════════════════════════════════════════════
  phase56-security-gate:
    name: Phase56 Security Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [quality-gates, quality-gate-bypass-audit, phase65-masterpiece-gate]
    if: ${{ needs.phase65-masterpiece-gate.result == 'success' && (needs.quality-gates.result == 'success' || needs.quality-gate-bypass-audit.result == 'success') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bizra-omega/target
          key: ${{ runner.os }}-cargo-phase56-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-phase56-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run security hardening regression gate
        run: ./scripts/phase56_security_gate.sh
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload Phase56 engine report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: phase56-engine-report
          path: artifacts/phase56/
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 4: Security Scan
  # ═══════════════════════════════════════════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [quality-gates, quality-gate-bypass-audit, phase65-masterpiece-gate, phase56-security-gate]
    if: ${{ needs.phase56-security-gate.result == 'success' && (needs.quality-gates.result == 'success' || needs.quality-gate-bypass-audit.result == 'success') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Python Security Scan (Bandit)
        run: |
          pip install bandit
          # Generate full report (informational — low/medium tracked separately)
          bandit -r core/ -f json -o bandit-report.json --exit-zero
          # GATE: Fail CI on HIGH severity + HIGH confidence findings
          bandit -r core/ -ll --confidence-level high

      - name: Python Dependency Scan (pip-audit)
        run: |
          pip install -e ".[dev]"
          # PYSEC-2024-48: urllib3 DoS via header regex — mitigated by httpx usage, no direct urllib3 calls
          pip-audit --strict --desc --ignore-vuln PYSEC-2024-48

      - name: Rust Security Audit
        working-directory: bizra-omega
        run: |
          cargo install cargo-audit
          cargo audit

      - name: Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284  # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Security Results
        uses: github/codeql-action/upload-sarif@60d8f0d1f1f8c8d07ef53bd027032705d414ec28  # v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true  # GitHub API upload failures are non-blocking
        with:
          sarif_file: 'trivy-results.sarif'

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 5: Build Docker Images
  # ═══════════════════════════════════════════════════════════════════════════
  build-python-image:
    name: Build Python Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [quality-gates, quality-gate-bypass-audit, phase56-security-gate, security-scan]
    if: ${{ needs.phase56-security-gate.result == 'success' && needs.security-scan.result == 'success' && (needs.quality-gates.result == 'success' || needs.quality-gate-bypass-audit.result == 'success') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build Python Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: deploy/Dockerfile.elite
          push: false
          tags: bizra-elite:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/bizra-elite.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bizra-elite-image
          path: /tmp/bizra-elite.tar
          retention-days: 7

  build-rust-image:
    name: Build Rust Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [quality-gates, quality-gate-bypass-audit, phase56-security-gate, security-scan]
    if: ${{ needs.phase56-security-gate.result == 'success' && needs.security-scan.result == 'success' && (needs.quality-gates.result == 'success' || needs.quality-gate-bypass-audit.result == 'success') }}
    defaults:
      run:
        working-directory: bizra-omega
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build Rust Image (CPU)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: bizra-omega
          file: bizra-omega/Dockerfile
          push: false
          tags: bizra-omega:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/bizra-omega.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bizra-omega-image
          path: /tmp/bizra-omega.tar
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 5b: Supply Chain Security (Blueprint Gates 10-11)
  # Gate 10: Container Signing (cosign + Sigstore)
  # Gate 11: SBOM Generation (syft + grype)
  # Standing on Giants: Sigstore (2021), SPDX (2010), CycloneDX
  # ═══════════════════════════════════════════════════════════════════════════
  container-signing:
    name: "Gate 10: Container Signing (cosign)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build-python-image, build-rust-image]
    if: ${{ needs.build-python-image.result == 'success' && needs.build-rust-image.result == 'success' }}
    # Hard-gated: Contract §12 item 3 — container signing blocks lock
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb  # v3

      - name: Download Python Image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: bizra-elite-image
          path: /tmp

      - name: Download Rust Image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: bizra-omega-image
          path: /tmp

      - name: Verify cosign availability
        run: |
          cosign version
          echo "::notice::cosign installed — container signing ready for Sprint 3 activation"

      - name: Keyless sign check (dry-run)
        run: |
          # Verify images are loadable — actual signing requires OIDC + registry push
          docker load --input /tmp/bizra-elite.tar
          docker load --input /tmp/bizra-omega.tar
          echo "## Gate 10: Container Signing" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| cosign installed | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Elite image loadable | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Omega image loadable | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| Keyless signing | PENDING (requires registry push + OIDC) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Activate in Sprint 3 (Task 3.1): push to GHCR + cosign sign --yes" >> $GITHUB_STEP_SUMMARY

  sbom-generation:
    name: "Gate 11: SBOM Generation (syft + grype)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-python-image, build-rust-image]
    if: ${{ needs.build-python-image.result == 'success' && needs.build-rust-image.result == 'success' }}
    # Hard-gated: Contract §12 item 4 — SBOM generation blocks lock
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install syft
        uses: anchore/sbom-action/download-syft@61a14dd21b7b4d67e4d11ddf8c8498afa5442c58  # v0

      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Download Python Image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: bizra-elite-image
          path: /tmp

      - name: Load and scan Elite image
        run: |
          docker load --input /tmp/bizra-elite.tar
          syft docker:bizra-elite:${{ github.sha }} -o spdx-json > elite-sbom.spdx.json
          echo "Elite SBOM generated: $(wc -l < elite-sbom.spdx.json) lines"

      - name: Vulnerability scan (grype)
        run: |
          grype sbom:elite-sbom.spdx.json --fail-on critical -o table | tee grype-report.txt
          echo "## Gate 11: SBOM + Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -30 grype-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            elite-sbom.spdx.json
            grype-report.txt
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 5c: Performance Gate (Blueprint Gate 12)
  # Gate 12: k6 load test — p95 < 200ms, error rate < 1%
  # Standing on Giants: k6/Grafana Labs (2017)
  # ═══════════════════════════════════════════════════════════════════════════
  performance-gate:
    name: "Gate 12: Performance Gate (k6)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-python-image]
    if: ${{ needs.build-python-image.result == 'success' }}
    continue-on-error: true  # Soft-gated until Sprint 3 hardens
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Download Python Image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: bizra-elite-image
          path: /tmp

      - name: Start Elite container
        run: |
          docker load --input /tmp/bizra-elite.tar
          docker run -d --name bizra-elite-perf \
            -p 3001:3001 \
            -e API_PORT=3001 \
            -e FAIL_CLOSED=false \
            -e GATE_MODE=constitutional \
            bizra-elite:${{ github.sha }}
          # Wait for healthy
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/v1/health > /dev/null 2>&1; then
              echo "Elite container healthy after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run k6 load test
        run: |
          cat > /tmp/k6-perf-gate.js << 'K6_EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate, Trend } from 'k6/metrics';

          const errorRate = new Rate('errors');
          const p95Latency = new Trend('p95_latency');

          export const options = {
            stages: [
              { duration: '10s', target: 10 },   // Ramp up
              { duration: '30s', target: 20 },   // Steady state
              { duration: '5s',  target: 0 },    // Ramp down
            ],
            thresholds: {
              http_req_duration: ['p(95)<200'],   // p95 < 200ms
              errors: ['rate<0.01'],              // Error rate < 1%
            },
          };

          export default function () {
            const res = http.get('http://localhost:3001/v1/health');
            check(res, {
              'status 200': (r) => r.status === 200,
              'latency < 200ms': (r) => r.timings.duration < 200,
            });
            errorRate.add(res.status !== 200);
            sleep(0.1);
          }
          K6_EOF
          k6 run /tmp/k6-perf-gate.js --summary-export=/tmp/k6-summary.json 2>&1 | tee /tmp/k6-output.txt || true
          echo "## Gate 12: Performance Gate (k6)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 /tmp/k6-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: docker rm -f bizra-elite-perf 2>/dev/null || true

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: k6-performance-${{ github.sha }}
          path: |
            /tmp/k6-summary.json
            /tmp/k6-output.txt
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Stage 6: Integration Tests
  # ═══════════════════════════════════════════════════════════════════════════
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [build-python-image, build-rust-image]
    services:
      redis:
        image: redis:7-alpine@sha256:b9f6cf0cab55fdd102fd2182deeae150457943d33439d18c6e2fc5666d3228c1
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Download Python Image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: bizra-elite-image
          path: /tmp

      - name: Load Docker Image
        run: docker load --input /tmp/bizra-elite.tar

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Run Integration Tests
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            -m "integration and not requires_ollama"
        env:
          PYTHONPATH: ${{ github.workspace }}
          REDIS_URL: redis://localhost:6379

  # ═══════════════════════════════════════════════════════════════════════════
  # Final: CI Summary
  # ═══════════════════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════════════════
  # Stage: Evidence Accumulation (Phase 60 Step 2)
  # Produces structured evidence.json per commit — audit trail for gate results.
  # Standing on Giants: Lamport (1978) event ordering, Merkle (1979) hash chains
  # ═══════════════════════════════════════════════════════════════════════════
  evidence-accumulate:
    name: Evidence Accumulation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [lint-python, lint-rust, lint-frontend, test-frontend, build-frontend, validate-schemas, cross-lang-sync, validate-deploy-overlays, test-python, test-rust, quality-gates, phase65-masterpiece-gate, phase56-security-gate, security-scan, container-signing, sbom-generation, performance-gate]
    if: always()
    steps:
      - name: Produce evidence.json
        run: |
          cat > evidence.json <<EVIDENCE_EOF
          {
            "schema_version": "1.0.0",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "actor": "${{ github.actor }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "constitutional_thresholds": {
              "ihsan": "${{ env.IHSAN_THRESHOLD }}",
              "snr": "${{ env.SNR_THRESHOLD }}"
            },
            "gates": {
              "lint_python": "${{ needs.lint-python.result }}",
              "lint_rust": "${{ needs.lint-rust.result }}",
              "schema_validation": "${{ needs.validate-schemas.result }}",
              "cross_lang_sync": "${{ needs.cross-lang-sync.result }}",
              "deploy_overlay_gate": "${{ needs.validate-deploy-overlays.result }}",
              "test_python": "${{ needs.test-python.result }}",
              "test_rust": "${{ needs.test-rust.result }}",
              "quality_gates": "${{ needs.quality-gates.result }}",
              "phase65_masterpiece": "${{ needs.phase65-masterpiece-gate.result }}",
              "phase65_gate_passed": "${{ needs.phase65-masterpiece-gate.outputs.gate_passed }}",
              "phase65_snr_score": "${{ needs.phase65-masterpiece-gate.outputs.snr_score }}",
              "phase65_avg_ihsan": "${{ needs.phase65-masterpiece-gate.outputs.avg_ihsan }}",
              "phase65_avg_latency_ms": "${{ needs.phase65-masterpiece-gate.outputs.avg_latency_ms }}",
              "phase65_speedup": "${{ needs.phase65-masterpiece-gate.outputs.speedup }}",
              "phase65_signed_receipts": "${{ needs.phase65-masterpiece-gate.outputs.signed_receipts }}",
              "phase65_tier": "${{ needs.phase65-masterpiece-gate.outputs.tier }}",
              "phase65_launch_decision": "${{ needs.phase65-masterpiece-gate.outputs.launch_decision }}",
              "phase65_launch_ready": "${{ needs.phase65-masterpiece-gate.outputs.launch_ready }}",
              "phase65_packet_signed": "${{ needs.phase65-masterpiece-gate.outputs.packet_signed }}",
              "autonomous_gate_passed": "${{ needs.phase65-masterpiece-gate.outputs.autonomous_gate_passed }}",
              "autonomous_score": "${{ needs.phase65-masterpiece-gate.outputs.autonomous_score }}",
              "autonomous_prompt_snr": "${{ needs.phase65-masterpiece-gate.outputs.autonomous_prompt_snr }}",
              "autonomous_rlvr_snr": "${{ needs.phase65-masterpiece-gate.outputs.autonomous_rlvr_snr }}",
              "autonomous_qualified_rate": "${{ needs.phase65-masterpiece-gate.outputs.autonomous_qualified_rate }}",
              "autonomous_compiled": "${{ needs.phase65-masterpiece-gate.outputs.autonomous_compiled }}",
              "autonomous_chain_valid": "${{ needs.phase65-masterpiece-gate.outputs.autonomous_chain_valid }}",
              "phase77_api_contract": "${{ needs.quality-gates.result }}",
              "phase56_security": "${{ needs.phase56-security-gate.result }}",
              "security_scan": "${{ needs.security-scan.result }}",
              "lint_frontend": "${{ needs.lint-frontend.result }}",
              "test_frontend": "${{ needs.test-frontend.result }}",
              "build_frontend": "${{ needs.build-frontend.result }}",
              "frontend_bundle_kb": "${{ needs.build-frontend.outputs.bundle_size_kb }}",
              "frontend_budget_pass": "${{ needs.build-frontend.outputs.budget_pass }}",
              "container_signing": "${{ needs.container-signing.result }}",
              "sbom_generation": "${{ needs.sbom-generation.result }}",
              "performance_gate": "${{ needs.performance-gate.result }}"
            },
            "all_gates_passed": $(
              if [ "${{ needs.lint-python.result }}" = "success" ] && \
                 [ "${{ needs.lint-rust.result }}" = "success" ] && \
                 [ "${{ needs.validate-schemas.result }}" = "success" ] && \
                 [ "${{ needs.cross-lang-sync.result }}" = "success" ] && \
                 [ "${{ needs.test-python.result }}" = "success" ] && \
                 [ "${{ needs.test-rust.result }}" = "success" ] && \
                 [ "${{ needs.quality-gates.result }}" = "success" ] && \
                 [ "${{ needs.phase65-masterpiece-gate.result }}" = "success" ] && \
                 [ "${{ needs.phase56-security-gate.result }}" = "success" ] && \
                 [ "${{ needs.security-scan.result }}" = "success" ] && \
                 [ "${{ needs.build-frontend.result }}" = "success" ] && \
                 [ "${{ needs.container-signing.result }}" = "success" ] && \
                 [ "${{ needs.sbom-generation.result }}" = "success" ]; then
                echo "true"
              else
                echo "false"
              fi
            )
          }
          EVIDENCE_EOF
          echo "::notice::Evidence artifact produced for commit ${{ github.sha }}"
          cat evidence.json

      - name: Upload evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: evidence-${{ github.sha }}
          path: evidence.json
          retention-days: 90

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [lint-python, lint-rust, lint-frontend, test-frontend, build-frontend, validate-schemas, validate-deploy-overlays, test-python, test-rust, quality-gates, quality-gate-bypass-audit, phase65-masterpiece-gate, phase56-security-gate, security-scan, build-python-image, build-rust-image, container-signing, sbom-generation, performance-gate, integration-tests, evidence-accumulate]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "# BIZRA CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Constitutional Thresholds" >> $GITHUB_STEP_SUMMARY
          echo "- Ihsan Threshold: ${{ env.IHSAN_THRESHOLD }}" >> $GITHUB_STEP_SUMMARY
          echo "- SNR Threshold: ${{ env.SNR_THRESHOLD }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Stage Results" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint Python | ${{ needs.lint-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint Rust | ${{ needs.lint-rust.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Validation | ${{ needs.validate-schemas.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Overlay Gate | ${{ needs.validate-deploy-overlays.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Python | ${{ needs.test-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Rust | ${{ needs.test-rust.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gates | ${{ needs.quality-gates.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate Bypass Audit | ${{ needs.quality-gate-bypass-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase65 Masterpiece Gate | ${{ needs.phase65-masterpiece-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase56 Security Gate | ${{ needs.phase56-security-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.lint-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Test | ${{ needs.test-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Evidence Accumulation | ${{ needs.evidence-accumulate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate 10: Container Signing | ${{ needs.container-signing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate 11: SBOM Generation | ${{ needs.sbom-generation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate 12: Performance Gate | ${{ needs.performance-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Phase65 KPI Snapshot" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Threshold |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gate Passed | ${{ needs.phase65-masterpiece-gate.outputs.gate_passed }} | true |" >> $GITHUB_STEP_SUMMARY
          echo "| SNR | ${{ needs.phase65-masterpiece-gate.outputs.snr_score }} | >= 0.90 |" >> $GITHUB_STEP_SUMMARY
          echo "| Avg Ihsan | ${{ needs.phase65-masterpiece-gate.outputs.avg_ihsan }} | >= 0.75 |" >> $GITHUB_STEP_SUMMARY
          echo "| Avg Latency (ms) | ${{ needs.phase65-masterpiece-gate.outputs.avg_latency_ms }} | <= 2200 |" >> $GITHUB_STEP_SUMMARY
          echo "| Speedup S1/S2 | ${{ needs.phase65-masterpiece-gate.outputs.speedup }} | >= 8.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| Signed Receipts | ${{ needs.phase65-masterpiece-gate.outputs.signed_receipts }} | true |" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | ${{ needs.phase65-masterpiece-gate.outputs.tier }} | elite-operational target |" >> $GITHUB_STEP_SUMMARY
          echo "| Launch Decision | ${{ needs.phase65-masterpiece-gate.outputs.launch_decision }} | GO for activation |" >> $GITHUB_STEP_SUMMARY
          echo "| Launch Ready | ${{ needs.phase65-masterpiece-gate.outputs.launch_ready }} | true |" >> $GITHUB_STEP_SUMMARY
          echo "| Packet Signed | ${{ needs.phase65-masterpiece-gate.outputs.packet_signed }} | true |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Autonomous Engine Gate" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Target |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gate Passed | ${{ needs.phase65-masterpiece-gate.outputs.autonomous_gate_passed }} | true |" >> $GITHUB_STEP_SUMMARY
          echo "| Composite Score | ${{ needs.phase65-masterpiece-gate.outputs.autonomous_score }} | >= 0.78 |" >> $GITHUB_STEP_SUMMARY
          echo "| Prompt SNR | ${{ needs.phase65-masterpiece-gate.outputs.autonomous_prompt_snr }} | >= 0.60 |" >> $GITHUB_STEP_SUMMARY
          echo "| RLVR SNR | ${{ needs.phase65-masterpiece-gate.outputs.autonomous_rlvr_snr }} | >= 0.55 |" >> $GITHUB_STEP_SUMMARY
          echo "| Qualified Rate | ${{ needs.phase65-masterpiece-gate.outputs.autonomous_qualified_rate }} | >= 0.60 |" >> $GITHUB_STEP_SUMMARY
          echo "| Compiled | ${{ needs.phase65-masterpiece-gate.outputs.autonomous_compiled }} | true |" >> $GITHUB_STEP_SUMMARY
          echo "| Chain Valid | ${{ needs.phase65-masterpiece-gate.outputs.autonomous_chain_valid }} | true |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Elite Blueprint v2 Audit" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Target |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Blueprint Gate Passed | ${{ needs.phase65-masterpiece-gate.outputs.blueprint_gate_passed }} | true |" >> $GITHUB_STEP_SUMMARY
          echo "| Blueprint Score | ${{ needs.phase65-masterpiece-gate.outputs.blueprint_score }} | >= 0.93 |" >> $GITHUB_STEP_SUMMARY
          echo "| Weights Total | ${{ needs.phase65-masterpiece-gate.outputs.blueprint_weights_total }} | 1.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed Checks | ${{ needs.phase65-masterpiece-gate.outputs.blueprint_failed_checks }} | 0 |" >> $GITHUB_STEP_SUMMARY
