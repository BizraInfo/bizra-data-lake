sape:
  symbolic:
    finding: "Ed25519 signing exists but is not enforced — receipts CAN be unsigned"
    invariant: "Amanah requires: no unsigned receipt reaches the chain"
    action: "WBS 2.5 — fail-closed enforcement"

  abstraction:
    finding: "Three proof systems (Z3, Receipt, Block) are individually verified but not connected"
    invariant: "Sprint 1 closed W4-W8. Sprint 2 closes SEL→RIR (the cognitive link)"
    action: "WBS 2.1 — wire ExperienceLedger"

  probe:
    finding: "84 f64 fields in islamic_finance.rs accumulate floating-point drift"
    invariant: "Adl requires exact arithmetic for monetary values"
    action: "WBS 2.4 — RegularNumber replacement"

  elevation:
    finding: "v0.87.0 proves the architecture works. Sprint 2 proves it's trustworthy."
    invariant: "Genesis Gate proved execution. Alpha-100 must prove governance."
