# BIZRA DDAGI OS — Production Nginx Configuration
# Security-hardened SPA serving with configurable API reverse proxy
#
# Used as envsubst template by official nginx Docker image:
#   /etc/nginx/templates/default.conf.template → /etc/nginx/conf.d/default.conf
# Variables resolved at container start: API_UPSTREAM, WS_UPSTREAM
#
# Standing on Giants: Nginx · OWASP Secure Headers · Google PageSpeed

# ─── Upstreams (resolved via envsubst from environment) ──────────────────
upstream api_backend {
    server ${API_UPSTREAM};
}

upstream ws_backend {
    server ${WS_UPSTREAM};
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Security Headers ─────────────────────────────────────────────────
    # NOTE: Nginx add_header in location blocks REPLACES server-level headers.
    # Security headers are set at server level and apply to all locations
    # that do NOT have their own add_header directives. Locations with custom
    # headers must re-include the security headers (see /assets/ and /index.html).
    add_header X-Frame-Options           "DENY"                            always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "0"                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Gzip Compression ─────────────────────────────────────────────────
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_min_length  256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Static Assets (hashed filenames → immutable cache) ───────────────
    location /assets/ {
        expires    1y;
        add_header Cache-Control          "public, immutable";
        add_header X-Frame-Options        "DENY"                           always;
        add_header X-Content-Type-Options "nosniff"                        always;
        access_log off;
    }

    # ── API Reverse Proxy (/v1 → Python Sovereign API) ───────────────────
    location /v1/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── WebSocket Proxy (/ws → Desktop Bridge) ───────────────────────────
    location /ws {
        proxy_pass         http://ws_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Health Check (K8s liveness + readiness probes) ────────────────────
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # ── SPA Fallback ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must revalidate on every request (deploy cache-busting)
    location = /index.html {
        add_header Cache-Control             "no-cache, no-store, must-revalidate";
        add_header Pragma                    "no-cache";
        add_header Expires                   "0";
        add_header X-Frame-Options           "DENY"                            always;
        add_header X-Content-Type-Options    "nosniff"                         always;
        add_header X-XSS-Protection          "0"                               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }

    # ── Block dot-files ──────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Error Pages ──────────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
