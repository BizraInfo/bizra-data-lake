# BIZRA Prometheus Configuration
# Monitoring for Elite Framework Observability
#
# Ihsān Metrics: Track constitutional compliance

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bizra-elite'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Elite Pipeline metrics
  - job_name: 'elite-pipeline'
    static_configs:
      - targets: ['elite-pipeline:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # Quality Gate metrics
  - job_name: 'quality-gate'
    static_configs:
      - targets: ['quality-gate:8095']
    metrics_path: /metrics
    scrape_interval: 10s

  # SAPE Optimizer metrics
  - job_name: 'sape-optimizer'
    static_configs:
      - targets: ['sape-optimizer:8000']
    metrics_path: /metrics
    scrape_interval: 30s

  # Risk Manager metrics
  - job_name: 'risk-manager'
    static_configs:
      - targets: ['risk-manager:8000']
    metrics_path: /metrics
    scrape_interval: 30s

  # =========================================================================
  # MCP Service Mesh metrics
  # =========================================================================

  # MCP Gateway (unified entry point)
  - job_name: 'bizra-mcp-gateway'
    static_configs:
      - targets: ['bizra-mcp-gateway:8080']
    metrics_path: /metrics
    scrape_interval: 10s

  # Sovereign MCP (House of Wisdom)
  - job_name: 'bizra-mcp-sovereign'
    static_configs:
      - targets: ['bizra-mcp-sovereign:8081']
    metrics_path: /metrics
    scrape_interval: 15s

  # Ecosystem MCP (Unified BIZRA OS)
  - job_name: 'bizra-mcp-ecosystem'
    static_configs:
      - targets: ['bizra-mcp-ecosystem:8082']
    metrics_path: /metrics
    scrape_interval: 15s

  # BIZRA DDAGI MCP (no K8s deployment yet — scrape disabled until deployed)
  # - job_name: 'bizra-mcp-ddagi'
  #   static_configs:
  #     - targets: ['bizra-mcp-ddagi:8083']
  #   metrics_path: /metrics
  #   scrape_interval: 15s

  # Peak Masterpiece Engine MCP
  - job_name: 'bizra-mcp-peak'
    static_configs:
      - targets: ['bizra-mcp-peak:8084']
    metrics_path: /metrics
    scrape_interval: 30s

  # Lake Bridge MCP (no K8s deployment yet — scrape disabled until deployed)
  # - job_name: 'bizra-mcp-lake'
  #   static_configs:
  #     - targets: ['bizra-mcp-lake:8085']
  #   metrics_path: /metrics
  #   scrape_interval: 15s

  # Docker daemon metrics (if available)
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
    metrics_path: /metrics
    scrape_interval: 60s
