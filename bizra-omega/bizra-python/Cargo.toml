[package]
name = "bizra-python"
version.workspace = true
edition = "2021"
description = "BIZRA Python Bindings — PyO3 bridge to Rust core"

[lib]
name = "bizra"
crate-type = ["cdylib"]

[dependencies]
bizra-core = { path = "../bizra-core" }
bizra-inference = { path = "../bizra-inference" }
bizra-autopoiesis = { path = "../bizra-autopoiesis" }
bizra-federation = { path = "../bizra-federation" }
bizra-hooks = { path = "../bizra-hooks" }
bizra-memory = { path = "../bizra-memory" }
bizra-action = { path = "../bizra-action" }
bizra-resourcepool = { path = "../bizra-resourcepool" }

pyo3 = { version = "0.24", features = ["extension-module"] }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
rust_decimal = { version = "1.34", features = ["serde"] }
chrono = { workspace = true }
serde_json = "1.0"
tokio = { workspace = true }
uuid = { workspace = true }
pqcrypto-mldsa = { workspace = true }
pqcrypto-traits = { workspace = true }
hex = { workspace = true }

[build-dependencies]
pyo3-build-config = "0.24"
