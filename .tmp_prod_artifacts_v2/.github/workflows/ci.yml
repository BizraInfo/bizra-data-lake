name: ci

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and start stack
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml up -d --build

      - name: Run conformance
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/conformance/requirements.txt
          export BIZRA_API_KEY="$(awk -F= '/^BIZRA_API_KEY=/{print $2}' deploy/.env)"
          pytest -q tools/conformance

      - name: Teardown stack
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml down -v || true

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests
        run: |
          kubeconform -strict -ignore-missing-schemas -summary deploy/k8s/*.yaml
