<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIZRA Nerve Center</title>
<style>
  /* ═══ Astrolabe Console Theme ═══ */
  :root {
    --navy: #0A1628;
    --navy-deep: #050B14;
    --gold: #C9A962;
    --gold-dim: #8B7640;
    --green: #22C55E;
    --red: #EF4444;
    --amber: #F59E0B;
    --slate: #94A3B8;
    --surface: #0F1D32;
    --surface-alt: #162340;
    --border: #1E3A5F;
    --text: #E2E8F0;
    --text-dim: #64748B;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--navy-deep);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ═══ Header ═══ */
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--surface) 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.5px;
  }
  .header .version {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface-alt);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: var(--mono);
  }
  .pulse-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(34,197,94,0); }
  }
  .header-right { display: flex; gap: 12px; align-items: center; }
  .uptime { font-family: var(--mono); font-size: 12px; color: var(--slate); }

  /* ═══ Grid Layout ═══ */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    padding: 20px 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .grid-full { grid-column: 1 / -1; }
  .grid-two  { grid-column: span 2; }

  /* ═══ Cards ═══ */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .card-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold-dim);
  }
  .card-body { padding: 16px; }

  /* ═══ Service Cards ═══ */
  .services { display: flex; gap: 12px; flex-wrap: wrap; }
  .svc-card {
    flex: 1;
    min-width: 200px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .svc-card-top { display: flex; justify-content: space-between; align-items: center; }
  .svc-name { font-weight: 600; font-size: 14px; }
  .svc-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .svc-badge.alive { background: rgba(34,197,94,0.15); color: var(--green); }
  .svc-badge.dead  { background: rgba(239,68,68,0.15); color: var(--red); }
  .svc-detail { font-size: 12px; color: var(--text-dim); font-family: var(--mono); }
  .svc-actions { margin-top: 4px; }
  .btn-restart {
    font-size: 11px;
    padding: 4px 12px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--slate);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-restart:hover { border-color: var(--gold); color: var(--gold); }
  .btn-restart:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ═══ Metrics Grid ═══ */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
  }
  .metric-box {
    background: var(--surface-alt);
    border-radius: 6px;
    padding: 12px;
    text-align: center;
  }
  .metric-value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
  }
  .metric-value.good { color: var(--green); }
  .metric-value.warn { color: var(--amber); }
  .metric-value.bad  { color: var(--red); }
  .metric-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* ═══ Log Viewer ═══ */
  .log-viewer {
    max-height: 320px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .log-entry {
    padding: 2px 8px;
    border-bottom: 1px solid rgba(30,58,95,0.3);
    display: flex;
    gap: 8px;
    white-space: nowrap;
  }
  .log-entry:hover { background: var(--surface-alt); }
  .log-ts { color: var(--text-dim); min-width: 80px; }
  .log-level { min-width: 55px; font-weight: 600; }
  .log-level.INFO    { color: var(--slate); }
  .log-level.WARNING { color: var(--amber); }
  .log-level.ERROR   { color: var(--red); }
  .log-level.DEBUG   { color: var(--text-dim); }
  .log-msg { color: var(--text); overflow: hidden; text-overflow: ellipsis; }

  .log-controls {
    display: flex; gap: 8px; align-items: center;
    font-size: 11px;
  }
  .log-controls select, .log-controls input {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--mono);
  }

  /* ═══ State Viewer ═══ */
  .state-json {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--surface-alt);
    padding: 12px;
    border-radius: 6px;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    color: var(--slate);
  }

  /* ═══ Responsive ═══ */
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .grid-two { grid-column: span 1; }
    .services { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div class="header">
  <div class="header-left">
    <div class="pulse-dot" id="pulseIndicator"></div>
    <h1>BIZRA NERVE CENTER</h1>
    <span class="version" id="versionBadge">---</span>
  </div>
  <div class="header-right">
    <span class="uptime" id="uptimeDisplay">Uptime: --</span>
  </div>
</div>

<!-- ═══ Dashboard Grid ═══ -->
<div class="grid">

  <!-- ── Services ── -->
  <div class="card grid-full">
    <div class="card-header">
      <span class="card-title">Service Topology</span>
      <span id="svcSummary" style="font-size:12px;color:var(--slate)">--</span>
    </div>
    <div class="card-body">
      <div class="services" id="servicesContainer">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- ── Metrics ── -->
  <div class="card grid-two">
    <div class="card-header">
      <span class="card-title">Request Metrics</span>
    </div>
    <div class="card-body">
      <div class="metrics-grid" id="metricsGrid">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- ── State ── -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Sovereign State</span>
    </div>
    <div class="card-body">
      <div class="state-json" id="stateJson">Loading...</div>
    </div>
  </div>

  <!-- ── Logs ── -->
  <div class="card grid-full">
    <div class="card-header">
      <span class="card-title">Log Stream</span>
      <div class="log-controls">
        <select id="logLevel">
          <option value="">ALL</option>
          <option value="INFO">INFO</option>
          <option value="WARNING">WARNING</option>
          <option value="ERROR">ERROR</option>
        </select>
        <input id="logCount" type="number" value="80" min="10" max="500" style="width:60px">
        <span style="color:var(--text-dim)" id="logTotal">0 captured</span>
      </div>
    </div>
    <div class="card-body" style="padding:0">
      <div class="log-viewer" id="logViewer">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  SOVEREIGN NERVE CENTER — Dashboard Controller
// ═══════════════════════════════════════════════════════════

const API = 'http://127.0.0.1:9740';
const POLL_INTERVAL = 5000;

// ── Formatters ──

function fmtUptime(s) {
  if (s < 60) return Math.round(s) + 's';
  if (s < 3600) return Math.floor(s/60) + 'm ' + Math.round(s%60) + 's';
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  return h + 'h ' + m + 'm';
}

function fmtNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return String(n);
}

function fmtTime(iso) {
  try { return new Date(iso).toLocaleTimeString(); }
  catch { return iso; }
}

// ── API Calls ──

async function fetchJson(path) {
  try {
    const r = await fetch(API + path, { mode: 'cors' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) {
    console.warn('Fetch failed:', path, e.message);
    return null;
  }
}

// ── Service Cards ──

function renderServices(status) {
  const el = document.getElementById('servicesContainer');
  if (!status) return;

  const backends = status.backends || [];
  const kernel = status.kernel || {};

  // Kernel card (always first)
  let html = `
    <div class="svc-card" style="border-color:var(--gold-dim)">
      <div class="svc-card-top">
        <span class="svc-name" style="color:var(--gold)">Sovereign Kernel</span>
        <span class="svc-badge alive">ALIVE</span>
      </div>
      <div class="svc-detail">PID ${kernel.pid || '--'} | :9740</div>
      <div class="svc-detail">v${kernel.version || '--'}</div>
    </div>`;

  backends.forEach(b => {
    const alive = b.alive;
    html += `
      <div class="svc-card">
        <div class="svc-card-top">
          <span class="svc-name">${b.name}</span>
          <span class="svc-badge ${alive ? 'alive' : 'dead'}">${alive ? 'ALIVE' : 'DOWN'}</span>
        </div>
        <div class="svc-detail">PID ${b.pid || '--'} | :${b.port}</div>
        <div class="svc-detail">Restarts: ${b.restarts}</div>
        <div class="svc-actions">
          <button class="btn-restart" onclick="restartBackend('${b.name}')" ${alive ? '' : ''}>
            Restart
          </button>
        </div>
      </div>`;
  });

  el.innerHTML = html;

  const aliveCount = backends.filter(b => b.alive).length;
  document.getElementById('svcSummary').textContent =
    `${aliveCount + 1}/${backends.length + 1} services healthy`;
  document.getElementById('versionBadge').textContent = kernel.version || '---';
  document.getElementById('uptimeDisplay').textContent = 'Uptime: ' + fmtUptime(kernel.uptime_s || 0);

  // Pulse indicator color
  const pulse = document.getElementById('pulseIndicator');
  pulse.style.background = aliveCount === backends.length ? 'var(--green)' :
                           aliveCount > 0 ? 'var(--amber)' : 'var(--red)';
}

// ── Metrics ──

function renderMetrics(m) {
  const el = document.getElementById('metricsGrid');
  if (!m) return;

  const errClass = m.error_rate < 0.01 ? 'good' : m.error_rate < 0.05 ? 'warn' : 'bad';
  const p95Class = m.latency_ms.p95 < 100 ? 'good' : m.latency_ms.p95 < 500 ? 'warn' : 'bad';

  el.innerHTML = `
    <div class="metric-box">
      <div class="metric-value">${fmtNum(m.requests_total)}</div>
      <div class="metric-label">Requests</div>
    </div>
    <div class="metric-box">
      <div class="metric-value ${errClass}">${(m.error_rate * 100).toFixed(1)}%</div>
      <div class="metric-label">Error Rate</div>
    </div>
    <div class="metric-box">
      <div class="metric-value ${p95Class}">${m.latency_ms.p95}ms</div>
      <div class="metric-label">p95 Latency</div>
    </div>
    <div class="metric-box">
      <div class="metric-value">${m.latency_ms.p50}ms</div>
      <div class="metric-label">p50 Latency</div>
    </div>
    <div class="metric-box">
      <div class="metric-value">${fmtNum(m.rpc_proxy.forwards)}</div>
      <div class="metric-label">RPC Forwards</div>
    </div>
    <div class="metric-box">
      <div class="metric-value">${fmtUptime(m.uptime_s)}</div>
      <div class="metric-label">Uptime</div>
    </div>`;
}

// ── Logs ──

function renderLogs(data) {
  const el = document.getElementById('logViewer');
  if (!data || !data.entries) return;

  let html = '';
  data.entries.forEach(e => {
    const ts = fmtTime(e.ts);
    html += `<div class="log-entry">
      <span class="log-ts">${ts}</span>
      <span class="log-level ${e.level}">${e.level.padEnd(7)}</span>
      <span class="log-msg">${escapeHtml(e.msg)}</span>
    </div>`;
  });

  el.innerHTML = html;
  document.getElementById('logTotal').textContent = data.total_captured + ' captured';

  // Auto-scroll to bottom
  el.scrollTop = el.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── State ──

function renderState(state) {
  const el = document.getElementById('stateJson');
  if (!state) { el.textContent = '(unreachable)'; return; }
  el.textContent = Object.keys(state).length
    ? JSON.stringify(state, null, 2)
    : '(not initialized -- first boot)';
}

// ── Backend Restart ──

async function restartBackend(name) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Restarting...';
  try {
    const r = await fetch(API + '/api/backends', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'restart', name }),
    });
    const data = await r.json();
    if (data.status === 'restarted') {
      btn.textContent = 'Restarted!';
    } else {
      btn.textContent = 'Failed';
    }
  } catch (e) {
    btn.textContent = 'Error';
  }
  setTimeout(() => { btn.textContent = 'Restart'; btn.disabled = false; }, 2000);
  refresh();
}

// ── Main Poll Loop ──

async function refresh() {
  const [status, metrics, state] = await Promise.all([
    fetchJson('/api/status'),
    fetchJson('/api/metrics'),
    fetchJson('/api/state'),
  ]);

  renderServices(status);
  renderMetrics(metrics);
  renderState(state);

  // Logs (separate call with params)
  const level = document.getElementById('logLevel').value;
  const n = document.getElementById('logCount').value;
  const logUrl = '/api/logs?n=' + n + (level ? '&level=' + level : '');
  const logs = await fetchJson(logUrl);
  renderLogs(logs);
}

// ── Init ──

refresh();
setInterval(refresh, POLL_INTERVAL);

// Pause polling when tab hidden
document.addEventListener('visibilitychange', () => {
  // Refresh immediately when tab becomes visible
  if (!document.hidden) refresh();
});
</script>

</body>
</html>
