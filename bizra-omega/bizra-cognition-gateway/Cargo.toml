[package]
name = "bizra-cognition-gateway"
version = "0.1.0"
edition = "2021"
description = "HTTP projection of bizra-cognition runtime state + dema CLI client"

[dependencies]
ed25519-dalek = "2.1"
bizra-cognition = { path = "../bizra-cognition", features = ["sled-store"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
axum = "0.7"
clap = { version = "4.5", features = ["derive", "color"] }
reqwest = { workspace = true }
anyhow = { workspace = true }
# Spearpoint A — Rust→TypeScript binding generation. Bindings are
# checked in at bindings/; `cargo test` regenerates them; CI fails on
# unstaged diff. UI consumers import from that directory.
ts-rs = { version = "10", features = ["no-serde-warnings"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
serde_json = { workspace = true }
tempfile = "3.10"

[[bin]]
name = "bizra-cognition-gateway"
path = "src/main.rs"

[[bin]]
name = "dema"
path = "src/bin/dema.rs"
