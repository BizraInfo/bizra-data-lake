# PAT Domain Registry
# ===================
# Defines domain clusters, elite practitioners, and unrelatedness matrix
# for cross-pollination validation

version: 1
id: pat_domains_v1
status: canonical

# Domain Clusters
# Each cluster contains related domains with high internal similarity
clusters:
  formal_sciences:
    id: "FORMAL"
    name: "Formal Sciences"
    description: "Abstract systems of rules and symbols"
    domains:
      - mathematics
      - logic
      - statistics
      - computer_science
      - information_theory
      - formal_verification
    keywords:
      - proof
      - theorem
      - axiom
      - algorithm
      - computation
      - formal_method

  natural_sciences:
    id: "NATURAL"
    name: "Natural Sciences"
    description: "Study of natural phenomena"
    domains:
      - physics
      - chemistry
      - biology
      - astronomy
      - geology
      - ecology
    keywords:
      - experiment
      - hypothesis
      - observation
      - natural_law
      - empirical

  engineering:
    id: "ENGINEER"
    name: "Engineering & Technology"
    description: "Applied sciences for solving practical problems"
    domains:
      - software_engineering
      - systems_engineering
      - electrical_engineering
      - mechanical_engineering
      - civil_engineering
      - aerospace_engineering
    keywords:
      - design
      - implementation
      - optimization
      - architecture
      - system

  life_sciences:
    id: "LIFE"
    name: "Life Sciences & Medicine"
    description: "Study of living organisms and health"
    domains:
      - medicine
      - neuroscience
      - genetics
      - pharmacology
      - epidemiology
      - psychology
    keywords:
      - clinical
      - diagnosis
      - treatment
      - cognition
      - behavior

  humanities:
    id: "HUMAN"
    name: "Humanities"
    description: "Study of human culture and expression"
    domains:
      - philosophy
      - ethics
      - history
      - linguistics
      - literature
      - art_theory
    keywords:
      - meaning
      - interpretation
      - culture
      - narrative
      - value

  social_sciences:
    id: "SOCIAL"
    name: "Social Sciences"
    description: "Study of society and human behavior"
    domains:
      - economics
      - sociology
      - political_science
      - anthropology
      - organizational_behavior
      - game_theory
    keywords:
      - institution
      - market
      - society
      - governance
      - incentive

  finance_business:
    id: "FINANCE"
    name: "Finance & Business"
    description: "Study of markets, money, and organizations"
    domains:
      - financial_economics
      - accounting
      - management_science
      - operations_research
      - risk_management
      - quantitative_finance
    keywords:
      - valuation
      - risk
      - return
      - strategy
      - portfolio

  applied_ai:
    id: "AI"
    name: "Applied AI & ML"
    description: "Machine learning and artificial intelligence applications"
    domains:
      - machine_learning
      - deep_learning
      - natural_language_processing
      - computer_vision
      - reinforcement_learning
      - ai_safety
    keywords:
      - model
      - training
      - inference
      - alignment
      - neural

  security_crypto:
    id: "SECURITY"
    name: "Security & Cryptography"
    description: "Protection of information and systems"
    domains:
      - cryptography
      - cybersecurity
      - privacy_engineering
      - distributed_systems
      - consensus_protocols
      - blockchain
    keywords:
      - encryption
      - authentication
      - integrity
      - trust
      - decentralization

