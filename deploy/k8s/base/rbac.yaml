# BIZRA RBAC Configuration
# Service accounts and role bindings
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bizra-service-account
  namespace: bizra
  labels:
    app.kubernetes.io/name: bizra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bizra-role
  namespace: bizra
rules:
  # Allow reading ConfigMaps for runtime configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Restrict secret access to the explicitly required secret only
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["bizra-secrets"]
    verbs: ["get"]
  # Allow reading own pod info
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  # Allow reading services for federation discovery
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bizra-role-binding
  namespace: bizra
subjects:
  - kind: ServiceAccount
    name: bizra-service-account
    namespace: bizra
roleRef:
  kind: Role
  name: bizra-role
  apiGroup: rbac.authorization.k8s.io
# NOTE: NetworkPolicy is defined in networkpolicy.yaml (single source of truth)
